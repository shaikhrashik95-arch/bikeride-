<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"> <title>Bike Traffic Rush 3D</title> <style> *{box-sizing:border-box} body{margin:0;overflow:hidden;background:#101820;color:white;font-family:Arial} canvas{display:block;width:100vw;height:100vh} #hud{position:fixed;inset:0;pointer-events:none} .panel{background:#101820dd;padding:10px;border-radius:10px} #stats{position:absolute;top:10px;left:10px;display:flex;gap:6px;font-size:12px} #speed{position:absolute;top:10px;right:10px;text-align:center;font-size:27px;color:#ffeb3b;font-weight:bold} button,select{pointer-events:auto;border:0;border-radius:10px;padding:12px;background:#00a86b;color:white;font-weight:bold} #sound{position:absolute;top:80px;right:10px} #menu{position:absolute;left:50%;top:23%;transform:translateX(-50%);width:90%;max-width:390px;text-align:center;background:#101820ee;padding:20px;border-radius:18px;pointer-events:auto} #menu h1{color:#ffeb3b;font-size:25px} #bike{width:100%;background:#263746;margin:8px 0} #controls{position:absolute;bottom:15px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px} .group{display:flex;gap:8px;pointer-events:auto} .ctrl{width:58px;height:58px;border-radius:50%;background:#173c50dd;border:2px solid #ffffff88;font-size:22px;padding:0} .horn{background:#e87900dd;font-size:12px} </style> </head> <body> <canvas id="game"></canvas> <div id="hud"> <div id="stats"> <div class="panel">LEVEL <b id="level">1</b>/16</div> <div class="panel">DISTANCE <b id="dist">0</b> m</div> </div> <div id="speed" class="panel">0<br><small>KM/H</small></div> <button id="sound">🔊 Sound ON</button> <div id="menu"> <h1>BIKE TRAFFIC RUSH 3D</h1> <p>Choose your bike and avoid traffic!</p> <select id="bike"> <option value="#ff3030">Sport Red</option> <option value="#00b0ff">Neon Blue</option> <option value="#00c853">Racing Green</option> <option value="#ffd740">Golden Rider</option> <option value="#b388ff">Purple Storm</option> <option value="#ffffff">White Arrow</option> <option value="#222222">Midnight Black</option> <option value="#ff6d00">Orange Nitro</option> <option value="#ff40b4">Cyber Pink</option> <option value="#eeeeee">Street White</option> </select><br> <button id="start">▶ START RIDE</button> <p id="result">▲ Accelerate • ▼ Brake • ◀ ▶ Steer • HORN</p> </div> <div id="controls"> <div class="group"> <button class="ctrl" id="left">◀</button> <button class="ctrl" id="right">▶</button> </div> <div class="group"> <button class="ctrl horn" id="horn">HORN</button> <button class="ctrl" id="brake">▼</button> <button class="ctrl" id="gas">▲</button> </div> </div> </div> <script type="module"> import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js'; const canvas=document.querySelector('#game'); const scene=new THREE.Scene(); scene.background=new THREE.Color(0x86c8f4); scene.fog=new THREE.Fog(0x86c8f4,45,180); const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300); camera.position.set(0,5.2,10); const renderer=new THREE.WebGLRenderer({canvas,antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); scene.add(new THREE.HemisphereLight(0xffffff,0x41633e,2)); const sun=new THREE.DirectionalLight(0xffffff,2); sun.position.set(-5,12,8);scene.add(sun); const material=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.6}); function box(parent,w,h,d,color,x,y,z){ const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color)); o.position.set(x,y,z);parent.add(o);return o; } const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),material(0x28733d)); ground.rotation.x=-Math.PI/2;ground.position.set(0,-.2,-70);scene.add(ground); const road=box(scene,13,.12,230,0x343940,0,-.08,-90); for(const x of [-6.3,6.3])box(scene,.15,.03,230,0xffffff,x,.01,-90); const dashes=[]; for(const x of [-2.1,2.1])for(let z=-200;z<15;z+=8)dashes.push(box(scene,.12,.025,2.6,0xffffff,x,.01,z)); function makeBike(color){ const g=new THREE.Group(); const rubber=material(0x111111),metal=material(0x9ba7b1); for(const z of [-.8,.8]){ const w=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,.17,16),rubber); w.rotation.z=Math.PI/2;w.position.set(0,.35,z);g.add(w); const hub=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.19,12),metal); hub.rotation.z=Math.PI/2;hub.position.set(0,.35,z);g.add(hub); } box(g,.42,.35,.9,color,0,.7,0); box(g,.35,.18,.5,0x17191c,0,.9,-.05); box(g,.24,.38,.28,0x252a30,0,1.1,-.2); const tank=new THREE.Mesh(new THREE.SphereGeometry(.28,14,10),material(color)); tank.scale.set(.8,.7,1.3);tank.position.set(0,.94,.2);g.add(tank); const head=new THREE.Mesh(new THREE.SphereGeometry(.18,12,10),material(0x111820)); head.position.set(0,1.55,.03);g.add(head); box(g,.1,.1,.2,0xffffff,0,.72,.92); const bar=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.75,8),metal); bar.rotation.z=Math.PI/2;bar.position.set(0,1.05,.48);g.add(bar); return g; } function makeCar(color){ const g=new THREE.Group(); box(g,1.45,.58,2.1,color,0,.55,0); box(g,1.05,.45,1,0x8dd7f0,0,.98,-.12); for(const x of [-.73,.73])for(const z of [-.65,.65]){ const w=new THREE.Mesh(new THREE.CylinderGeometry(.19,.19,.14,12),material(0x111111)); w.rotation.z=Math.PI/2;w.position.set(x,.25,z);g.add(w); } box(g,.3,.14,.05,0xff2020,0,.55,1.07); return g; } let player=makeBike(document.querySelector('#bike').value); player.position.set(0,0,3);scene.add(player); let traffic=[],running=false,speed=0,dist=0,level=1,lane=0,steer=0; let gas=false,braking=false,spawn=0,last=0,roadOffset=0; function spawnCar(){ const lanes=[-4.2,0,4.2]; const car=makeCar([0xffc107,0xe53935,0xeceff1,0x1976d2,0x222222][Math.floor(Math.random()*5)]); car.position.set(lanes[Math.floor(Math.random()*3)],0,-100-Math.random()*30); scene.add(car);traffic.push(car); } function clearCars(){traffic.forEach(c=>scene.remove(c));traffic=[];} let audio=null,engine=null,engineGain=null,soundOn=true; function audioInit(){ if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)(); if(audio.state==='suspended')audio.resume(); } function tone(freq,duration,type='sawtooth',volume=.08){ if(!soundOn)return; audioInit(); const o=audio.createOscillator(),g=audio.createGain(); o.type=type;o.frequency.value=freq; g.gain.setValueAtTime(volume,audio.currentTime); g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration); o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration); } function engineStart(){ if(!soundOn||engine)return; audioInit();engine=audio.createOscillator();engineGain=audio.createGain(); engine.type='sawtooth';engine.frequency.value=70;engineGain.gain.value=.018; engine.connect(engineGain);engineGain.connect(audio.destination);engine.start(); } function engineStop(){ if(engine){try{engine.stop()}catch(e){}engine=null;engineGain=null} } function engineUpdate(){ if(!running||!soundOn){engineStop();return} engineStart(); if(engine){engine.frequency.setTargetAtTime(65+speed*2,audio.currentTime,.08);engineGain.gain.setTargetAtTime(.008+speed/200*.02,audio.currentTime,.08)} } function hornSound(){tone(500,.32,'square',.12);setTimeout(()=>tone(400,.28,'square',.1),120)} function crashSound(){tone(95,.5,'sawtooth',.18);setTimeout(()=>tone(55,.6,'triangle',.14),100)} function startGame(){ clearCars();scene.remove(player);player=makeBike(document.querySelector('#bike').value); player.position.set(0,0,3);scene.add(player); running=true;speed=0;dist=0;level=1;lane=0;spawn=0; document.querySelector('#menu').style.display='none';engineStart(); } function endGame(){ if(!running)return;running=false;engineStop();crashSound(); const menu=document.querySelector('#menu');menu.style.display='block'; menu.querySelector('h1').textContent='💥 GAME OVER'; document.querySelector('#start').textContent='↻ RESTART'; document.querySelector('#result').textContent='Distance: '+Math.floor(dist)+' m. Tap restart to play again.'; } document.querySelector('#start').onclick=()=>{document.querySelector('#menu h1').textContent='BIKE TRAFFIC RUSH 3D';document.querySelector('#start').textContent='▶ START RIDE';startGame()}; document.querySelector('#bike').onchange=()=>{if(!running){scene.remove(player);player=makeBike(document.querySelector('#bike').value);player.position.set(0,0,3);scene.add(player)}}; document.querySelector('#sound').onclick=()=>{ soundOn=!soundOn;document.querySelector('#sound').textContent=soundOn?'🔊 Sound ON':'🔇 Sound OFF'; if(!soundOn)engineStop();else if(running)engineStart(); }; document.querySelector('#horn').onpointerdown=e=>{e.preventDefault();hornSound()}; function hold(id,down,up){ const el=document.querySelector('#'+id); el.addEventListener('pointerdown',e=>{e.preventDefault();down()}); ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,up)); } hold('left',()=>steer=-1,()=>{if(steer===-1)steer=0}); hold('right',()=>steer=1,()=>{if(steer===1)steer=0}); hold('gas',()=>gas=true,()=>gas=false); hold('brake',()=>braking=true,()=>braking=false); window.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft')steer=-1;if(e.key==='ArrowRight')steer=1; if(e.key==='ArrowUp')gas=true;if(e.key==='ArrowDown')braking=true; }); window.addEventListener('keyup',e=>{ if(e.key==='ArrowLeft'||e.key==='ArrowRight')steer=0; if(e.key==='ArrowUp')gas=false;if(e.key==='ArrowDown')braking=false; }); function update(dt){ if(running){ speed=gas?Math.min(200,speed+65*dt):Math.max(0,speed-5*dt); if(braking)speed=Math.max(0,speed-100*dt); dist+=speed/3.6*dt;level=Math.min(16,1+Math.floor(dist/160)); document.querySelector('#speed').innerHTML=Math.round(speed)+'<br><small>KM/H</small>'; document.querySelector('#dist').textContent=Math.floor(dist); document.querySelector('#level').textContent=level; lane=THREE.MathUtils.clamp(lane+steer*7*dt,-4.6,4.6); player.position.x=THREE.MathUtils.lerp(player.position.x,lane,.2); player.rotation.z=-steer*.08; const move=speed/3.6*dt; roadOffset+=move; dashes.forEach(d=>{d.position.z+=move;if(d.position.z>8)d.position.z-=216}); spawn-=dt;if(spawn<=0){spawnCar();spawn=Math.max(.55,1.5-level*.04)} for(let i=traffic.length-1;i>=0;i--){ const c=traffic[i];c.position.z+=(7+speed*.13+level*.2)*dt; if(Math.abs(c.position.x-player.position.x)<1.3&&Math.abs(c.position.z-player.position.z)<1.7){endGame();break} if(c.position.z>18){scene.remove(c);traffic.splice(i,1)} } engineUpdate(); } camera.position.x=THREE.MathUtils.lerp(camera.position.x,player.position.x*.25,.05); camera.lookAt(player.position.x*.15,1,-12); } function animate(now){ requestAnimationFrame(animate); const dt=last?Math.min((now-last)/1000,.05):0;last=now; update(dt);renderer.render(scene,camera); } window.addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight); }); requestAnimationFrame(animate); </script> </body> </html>
