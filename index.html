<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"> <title>Bike Traffic Rush 3D</title> <style> *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden; background:#07111c;color:white;font-family:Arial,sans-serif} canvas{display:block;width:100%;height:100%;touch-action:none} #hud{position:absolute;top:8px;left:8px;right:8px; display:flex;justify-content:space-between;pointer-events:none} .box{background:#101e2cdd;padding:9px;border:1px solid #587084; border-radius:10px;font-size:13px;line-height:1.7} #menu{position:absolute;inset:0;background:#06101bdc; display:flex;align-items:center;justify-content:center;padding:18px} #card{width:100%;max-width:430px;text-align:center;padding:22px 16px; border:2px solid #28d1ff;border-radius:20px; background:linear-gradient(145deg,#1a354e,#07111d)} h1{color:#52dcff;font-size:clamp(26px,7vw,36px)} p{line-height:1.55;color:#e3edf7} button{font-weight:bold;touch-action:manipulation;user-select:none} #start{width:100%;padding:17px;border:0;border-radius:12px; background:#ffce32;color:#111;font-size:21px} #controls{position:absolute;bottom:12px;left:0;right:0; display:flex;justify-content:space-between;padding:0 12px} .group{display:flex;gap:8px} .ctrl{width:clamp(56px,17vw,76px);height:clamp(62px,17vw,80px); border:3px solid #a2afbd;border-radius:15px; background:#132538;color:white;font-size:24px} .gas{background:#087541;border-color:#8be5b2;font-size:13px} .brake{background:#912929;border-color:#ffaaaa;font-size:12px} #hint{position:absolute;bottom:102px;width:100%;text-align:center; font-size:12px;color:#fff;pointer-events:none} .hidden{display:none!important} </style> </head> <body> <canvas id="c"></canvas> <div id="hud"> <div class="box">LEVEL <b id="level">1</b>/16<br> DISTANCE <b id="distance">0</b> m</div> <div class="box" style="text-align:right">SCORE <b id="score">0</b><br> SPEED <b id="speed">0</b> km/h</div> </div> <div id="menu"> <div id="card"> <h1 id="title">BIKE TRAFFIC RUSH 3D</h1> <p id="msg">Avoid buses, trucks, lorries and bikes. Complete 16 levels!</p> <p>⬅ LEFT &nbsp; RIGHT ➜<br>🟢 GAS &nbsp; 🔴 BRAKE</p> <button id="start" type="button">START RIDE</button> <p id="status">Mobile browser game · 3D-style graphics</p> </div> </div> <div id="hint">Hold GAS to accelerate · Avoid traffic</div> <div id="controls"> <div class="group"> <button class="ctrl" id="left">◀</button> <button class="ctrl" id="right">▶</button> </div> <div class="group"> <button class="ctrl brake" id="brake">BRAKE</button> <button class="ctrl gas" id="gas">GAS ▲</button> </div> </div> <script> (function(){ "use strict"; var canvas=document.getElementById("c"); var ctx=canvas.getContext("2d"); var W=0,H=0,dpr=1; function resize(){ W=window.innerWidth;H=window.innerHeight; dpr=Math.min(window.devicePixelRatio||1,2); canvas.width=Math.floor(W*dpr); canvas.height=Math.floor(H*dpr); canvas.style.width=W+"px"; canvas.style.height=H+"px"; ctx.setTransform(dpr,0,0,dpr,0,0); } window.addEventListener("resize",resize); resize(); var menu=document.getElementById("menu"); var startButton=document.getElementById("start"); var running=false,level=1,score=0,distance=0; var speed=0,playerX=0,roadMove=0,levelDistance=0; var traffic=[],spawn=0,last=0; var keys={left:false,right:false,gas:false,brake:false}; var colors=["#f04444","#2788d8","#eabf35","#35a96a","#e9e9e9"]; function el(id){return document.getElementById(id)} function hud(){ el("level").textContent=level; el("distance").textContent=Math.floor(distance); el("score").textContent=score; el("speed").textContent=Math.floor(speed); } function resetKeys(){ Object.keys(keys).forEach(function(k){keys[k]=false}); } function startGame(){ level=1;score=0;distance=0;speed=0;playerX=0; roadMove=0;levelDistance=0;traffic=[];spawn=.5; resetKeys();running=true; menu.classList.add("hidden"); el("hint").textContent="Hold GAS to accelerate · Avoid traffic"; hud(); } startButton.addEventListener("click",function(e){ e.preventDefault();startGame(); }); /* Also support older mobile touch events */ startButton.addEventListener("touchend",function(e){ e.preventDefault(); if(!running)startGame(); },{passive:false}); function bind(id,key){ var b=el(id); b.addEventListener("pointerdown",function(e){ e.preventDefault();keys[key]=true; }); ["pointerup","pointercancel","pointerleave"].forEach(function(name){ b.addEventListener(name,function(){keys[key]=false}); }); } bind("left","left");bind("right","right"); bind("gas","gas");bind("brake","brake"); window.addEventListener("keydown",function(e){ var k=e.key.toLowerCase(); if(k==="arrowleft"||k==="a")keys.left=true; if(k==="arrowright"||k==="d")keys.right=true; if(k==="arrowup"||k==="w")keys.gas=true; if(k==="arrowdown"||k==="s")keys.brake=true; }); window.addEventListener("keyup",function(e){ var k=e.key.toLowerCase(); if(k==="arrowleft"||k==="a")keys.left=false; if(k==="arrowright"||k==="d")keys.right=false; if(k==="arrowup"||k==="w")keys.gas=false; if(k==="arrowdown"||k==="s")keys.brake=false; }); window.addEventListener("blur",resetKeys); function rect(x,y,w,h,color){ ctx.fillStyle=color;ctx.fillRect(x,y,w,h); } function polygon(points,color){ ctx.fillStyle=color;ctx.beginPath(); points.forEach(function(p,i){ if(i===0)ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); }); ctx.closePath();ctx.fill(); } function roundRect(x,y,w,h,r,color){ ctx.fillStyle=color;ctx.beginPath(); ctx.roundRect(x,y,w,h,r);ctx.fill(); } function road(y){ var t=Math.max(0,Math.min(1,(y-H*.29)/(H*.71))); return W*(.08+.42*t); } function laneX(lane,z){ return W/2+lane*W*(.14+.28*z); } function drawTree(x,y,s){ rect(x-s*.07,y-s*.65,s*.14,s*.65,"#63452f"); ctx.fillStyle="#15502a";ctx.beginPath(); ctx.arc(x,y-s*.8,s*.45,0,Math.PI*2);ctx.fill(); ctx.fillStyle="#28743a";ctx.beginPath(); ctx.arc(x-s*.1,y-s*1.05,s*.3,0,Math.PI*2);ctx.fill(); } function drawWorld(){ var sky=ctx.createLinearGradient(0,0,0,H*.5); sky.addColorStop(0,"#37a4dc");sky.addColorStop(1,"#e0f5ff"); rect(0,0,W,H,"#347448"); ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.5); polygon([[0,H*.43],[W*.18,H*.27],[W*.36,H*.4], [W*.55,H*.25],[W*.78,H*.39],[W,H*.29],[W,H*.5],[0,H*.5]],"#6b8a79"); polygon([[W*.42,H*.29],[W*.58,H*.29],[W*1.08,H],[W*-.08,H]],"#3c4148"); polygon([[W*.414,H*.29],[W*.42,H*.29],[W*-.08,H],[W*-.13,H]],"#f3e8d0"); polygon([[W*.58,H*.29],[W*.586,H*.29],[W*1.13,H],[W*1.08,H]],"#f3e8d0"); for(var i=0;i<16;i++){ var t=((i/16+roadMove*.0015)%1); var y=H*.29+t*H*.71; var half=road(y),dash=3+t*30; rect(W/2-half/3-dash/2,y,dash,2+t*3,"#f6f1d9"); rect(W/2+half/3-dash/2,y,dash,2+t*3,"#f6f1d9"); } for(var j=0;j<9;j++){ var q=((j/9+roadMove*.0007)%1); var yy=H*.29+q*H*.71; var half2=road(yy),s=5+q*19; drawTree(W/2-half2-W*.05-s,yy,s); drawTree(W/2+half2+W*.05+s,yy,s*.8); } } function drawBike(x,y,s,color){ ctx.fillStyle="#0008";ctx.beginPath(); ctx.ellipse(x,y,12*s,5*s,0,0,Math.PI*2);ctx.fill(); ctx.strokeStyle="#111820";ctx.lineWidth=5*s; ctx.beginPath();ctx.ellipse(x,y-7*s,5*s,13*s,0,0,Math.PI*2);ctx.stroke(); ctx.strokeStyle=color;ctx.lineWidth=5*s; ctx.beginPath();ctx.moveTo(x,y-8*s); ctx.lineTo(x-6*s,y-23*s);ctx.lineTo(x+6*s,y-23*s); ctx.lineTo(x,y-8*s);ctx.stroke(); ctx.strokeStyle="#222";ctx.lineWidth=2*s; ctx.beginPath();ctx.moveTo(x-10*s,y-27*s); ctx.lineTo(x+10*s,y-27*s);ctx.stroke(); ctx.fillStyle="#e99d2d";ctx.fillRect(x-3*s,y-34*s,6*s,12*s); ctx.fillStyle="#f0f4f8";ctx.beginPath(); ctx.arc(x,y-39*s,6*s,0,Math.PI*2);ctx.fill(); ctx.fillStyle="#27384a";ctx.fillRect(x-5*s,y-41*s,10*s,3*s); } function drawVehicle(v){ var y=H*.29+v.z*H*.71; var x=laneX(v.lane,v.z); var s=.3+v.z*1.25; if(v.type==="bike"){ drawBike(x,y,Math.max(.4,s*.65),v.color);return; } var w=W*(v.type==="bus"?.12:.095)*s; var h=H*(v.type==="bus"?.17:.14)*s; ctx.fillStyle="#0007";ctx.beginPath(); ctx.ellipse(x,y,w*.65,h*.1,0,0,Math.PI*2);ctx.fill(); roundRect(x-w/2,y-h,w,h,Math.max(2,w*.06),v.color); roundRect(x-w*.36,y-h*.86,w*.72,h*.22,3,"#a6deed"); if(v.type==="bus"){ for(var i=0;i<4;i++){ roundRect(x-w*.42+i*w*.22,y-h*.58,w*.18,h*.17,2,"#bcebf7"); } }else{ roundRect(x-w*.34,y-h*.56,w*.68,h*.18,2,"#8fc4dc"); if(v.type==="truck"||v.type==="lorry"){ roundRect(x-w*.44,y-h*.34,w*.88,h*.29,2,"#d9e0e5"); } } rect(x-w*.43,y-h*.13,w*.18,h*.06,"#ff4141"); rect(x+w*.25,y-h*.13,w*.18,h*.06,"#ff4141"); rect(x-w*.55,y-h*.29,w*.14,h*.23,"#141719"); rect(x+w*.41,y-h*.29,w*.14,h*.23,"#141719"); } function drawPlayer(){ drawBike(W/2+playerX*W*.30,H*.84,Math.min(1.15,W/390),"#ed3048"); } function finish(won){ running=false;resetKeys(); el("title").textContent=won?"YOU WIN!":"GAME OVER"; el("msg").textContent=won? "Congratulations! All 16 levels completed. Score: "+score: "You crashed on level "+level+". Score: "+score; startButton.textContent="PLAY AGAIN"; el("status").textContent="Tap PLAY AGAIN to restart"; el("hint").textContent=""; menu.classList.remove("hidden"); } function update(dt){ if(!running)return; var max=115+level*6; speed=Math.max(0,Math.min(max, speed+((keys.gas?125:0)-(keys.brake?190:0)-12)*dt)); if(keys.left)playerX-=dt*1.7; if(keys.right)playerX+=dt*1.7; playerX=Math.max(-1.05,Math.min(1.05,playerX)); distance+=speed*dt*.38; levelDistance+=speed*dt*.38; roadMove+=speed*dt; spawn-=dt; if(spawn<=0){ var lane=Math.floor(Math.random()*3)-1; var blocked=traffic.some(function(v){return v.lane===lane&&v.z<.3}); if(!blocked){ var r=Math.random(); var type=r<.23?"bus":r<.48?"truck":r<.72?"lorry":"bike"; traffic.push({lane:lane,z:.01,type:type, color:colors[Math.floor(Math.random()*colors.length)]}); } spawn=Math.max(.45,1.1-level*.025); } var px=W/2+playerX*W*.30; for(var i=traffic.length-1;i>=0;i--){ var v=traffic[i]; v.z+=(.20+speed/max*.22+level*.005)*dt; if(v.z>.72){ var ox=laneX(v.lane,v.z); var hitWidth=W*(v.type==="bike"?.045:.075); if(Math.abs(ox-px)<hitWidth){ finish(false);return; } score+=50;traffic.splice(i,1); }else if(v.z>1.2){ traffic.splice(i,1); } } if(levelDistance>=400+level*100){ levelDistance=0;score+=500; if(level>=16){finish(true);return} level++; traffic=traffic.filter(function(v){return v.z<.25}); } hud(); } function frame(now){ var dt=Math.min((now-last)/1000||0,.04); last=now; try{ update(dt); drawWorld(); traffic.sort(function(a,b){return a.z-b.z}); traffic.forEach(drawVehicle); drawPlayer(); }catch(err){ running=false; menu.classList.remove("hidden"); el("title").textContent="GAME ERROR"; el("msg").textContent=String(err.message||err); startButton.textContent="TRY AGAIN"; } requestAnimationFrame(frame); } hud(); requestAnimationFrame(frame); })(); </script> </body> </html>
