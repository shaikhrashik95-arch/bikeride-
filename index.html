<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"> <title>Bike Traffic Rush 3D</title> <style> *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#83ccef;font-family:Arial;touch-action:none} canvas{display:block} #hud{position:fixed;z-index:3;top:7px;left:5px;right:5px;display:flex;justify-content:space-between;gap:4px;pointer-events:none} .stat{background:#101cdd;color:white;border-radius:8px;padding:7px 5px;text-align:center;font-size:12px;font-weight:bold} #top{position:fixed;z-index:5;right:6px;top:54px;display:flex;gap:4px} button,select{border:0;border-radius:9px;padding:10px;background:#17212b;color:white;font-weight:bold} #controls{position:fixed;z-index:4;bottom:12px;left:5px;right:5px;display:flex;justify-content:space-between;gap:3px} .pad{display:flex;gap:4px;align-items:center} .ctrl{height:56px;min-width:40px;padding:4px;font-size:11px;border:2px solid #ffffff66;touch-action:none} #left,#right{border-radius:50%;font-size:21px} #gas{background:#078347} #brake{background:#c62828} #horn{background:#946600} #hint{position:fixed;z-index:3;bottom:74px;width:100%;text-align:center;color:white;font-size:11px;text-shadow:0 2px 4px #000;pointer-events:none} #menu{position:fixed;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:#061321cc;padding:12px;color:white} .panel{width:min(390px,100%);max-height:90vh;overflow:auto;background:#101b26f5;border-radius:18px;padding:18px;text-align:center} h1{font-size:23px;color:#ffd54a} p{font-size:13px;line-height:1.5} select{width:100%;margin:8px 0} #start{width:100%;background:#079d51;font-size:19px;margin-top:8px} @media(max-width:360px){.ctrl{min-width:34px;font-size:10px}.pad{gap:2px}} </style> </head> <body> <div id="hud"> <div class="stat">SPEED<br><span id="speed">0</span> km/h</div> <div class="stat">LEVEL<br><span id="level">1</span>/200</div> <div class="stat">DISTANCE<br><span id="distance">0</span> m</div> </div> <div id="top"> <button id="sound">🔊 SOUND ON</button> <button id="pause">PAUSE</button> </div> <div id="hint">HOLD GAS TO ACCELERATE • RELEASE TO SLOW</div> <div id="controls"> <div class="pad"> <button class="ctrl" id="left">◀</button> <button class="ctrl" id="right">▶</button> </div> <div class="pad"> <button class="ctrl" id="horn">HORN</button> <button class="ctrl" id="brake">BRAKE</button> <button class="ctrl" id="gas">GAS</button> </div> </div> <div id="menu"> <div class="panel"> <h1 id="title">🏍️ BIKE TRAFFIC RUSH 3D</h1> <p>Select a bike style and colour.</p> <select id="bike"> <option value="0">01 Sport Red</option> <option value="1">02 Cruiser Blue</option> <option value="2">03 Superbike Green</option> <option value="3">04 Touring Yellow</option> <option value="4">05 Racing Purple</option> <option value="5">06 Classic Orange</option> <option value="6">07 Sport White</option> <option value="7">08 Touring Black</option> <option value="8">09 Street Pink</option> <option value="9">10 Cruiser Cyan</option> <option value="10">11 Superbike Silver</option> <option value="11">12 Touring Lime</option> <option value="12">13 Racing Magenta</option> <option value="13">14 Classic Bronze</option> <option value="14">15 Sport Ice Blue</option> <option value="15">16 Adventure Emerald</option> </select> <p>Maximum speed: 200 km/h<br>200 levels • 3D traffic • Engine sound • Horn</p> <div id="message">Ready to ride?</div> <button id="start">START GAME</button> </div> </div> <script type="module"> import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js'; const $=id=>document.getElementById(id); const scene=new THREE.Scene(); scene.background=new THREE.Color(0x83ccef); scene.fog=new THREE.Fog(0x83ccef,75,270); const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,700); camera.position.set(0,5.2,10); const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.shadowMap.enabled=true; renderer.outputColorSpace=THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement); scene.add(new THREE.HemisphereLight(0xffffff,0x526044,2)); const sun=new THREE.DirectionalLight(0xffffff,2); sun.position.set(-12,25,10); sun.castShadow=true; scene.add(sun); function material(c,r=.65,m=0){ return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m}); } const cube=new THREE.BoxGeometry(1,1,1); function box(p,w,h,d,ma,x,y,z){ const o=new THREE.Mesh(cube,ma); o.scale.set(w,h,d);o.position.set(x,y,z); o.castShadow=true;o.receiveShadow=true;p.add(o);return o; } function cyl(p,r,h,ma,x,y,z,rx=0,rz=0){ const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,18),ma); o.position.set(x,y,z);o.rotation.set(rx,0,rz);o.castShadow=true;p.add(o);return o; } /* ROAD */ const grass=material(0x438b3b),asphalt=material(0x30343a); const white=material(0xffffff),rail=material(0x9ca8b0,.4,.5); box(scene,400,.3,720,grass,0,-.35,-140); const road=new THREE.Group();scene.add(road); box(road,13,.16,370,asphalt,0,-.12,-140); box(road,.18,.04,370,white,-6.3,-.01,-140); box(road,.18,.04,370,white,6.3,-.01,-140); const dashes=[]; for(let z=25;z>-350;z-=8) for(const x of [-2.1,2.1])dashes.push(box(road,.12,.035,3.5,white,x,-.01,z)); for(const x of [-7,7]){ box(road,.18,.5,370,rail,x,.1,-140); for(let z=15;z>-340;z-=18)box(road,.22,.6,.25,rail,x,.05,z); } /* TREES AND BUILDINGS */ const scenery=[],bark=material(0x704522); const leaves=[material(0x28743b),material(0x398c49)]; const buildings=[material(0xc6b7a0),material(0x8fa6b5),material(0xd1c5b5),material(0xb3b5b8)]; const windowMat=material(0x92d9f2,.25,.1); function makeTree(x,z){ const g=new THREE.Group();g.position.set(x,0,z); cyl(g,.15,1.5,bark,0,.75,0); const a=new THREE.Mesh(new THREE.ConeGeometry(.95,2.2,9),leaves[0]); a.position.y=2.1;a.castShadow=true;g.add(a); const b=new THREE.Mesh(new THREE.ConeGeometry(.65,1.5,9),leaves[1]); b.position.y=2.8;g.add(b);scene.add(g);scenery.push(g); } function makeBuilding(x,z){ const g=new THREE.Group(),w=3+Math.random()*3,h=4+Math.random()*9,d=3; g.position.set(x,h/2,z); box(g,w,h,d,buildings[Math.floor(Math.random()*buildings.length)],0,0,0); for(let y=-h/2+.8;y<h/2-.3;y+=1.4) for(let xx=-w/2+.5;xx<w/2-.2;xx+=1.1) box(g,.42,.6,.04,windowMat,xx,y,d/2+.03); scene.add(g);scenery.push(g); } for(let z=25;z>-340;z-=12) for(const s of [-1,1]){ const x=s*(10+Math.random()*10); if(Math.random()<.65)makeTree(x,z-Math.random()*6); else makeBuilding(x,z-Math.random()*6); } /* 16 BIKE STYLES */ const bikeColors=[ 0xe53935,0x1677ff,0x39d353,0xffd600,0x8e44ad,0xff7800, 0xf4f7fa,0x20252b,0xff4fa3,0x00cfe8,0xaeb7c1,0xb4ed21, 0xe000a5,0xb87333,0x9cecff,0x008f62 ]; const rubber=material(0x08090a),chrome=material(0xbec8d0,.3,.7); let player=new THREE.Group(); function makeBike(index){ scene.remove(player);player=new THREE.Group(); const paint=material(bikeColors[index],.25,.42); const black=material(0x15191d),jacket=material(0x202d42); const helmetMat=material([0xf5f5f5,0x101010,0xf5d000,0xe63232][index%4],.2,.3); const sport=[0,2,4,6,8,10,12,14].includes(index); const cruiser=[1,5,9,13].includes(index); const touring=[3,7,11,15].includes(index); for(const z of [-.95,.88]){ const r=cruiser?.44:.39; const wheel=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.2,28),rubber); wheel.rotation.z=Math.PI/2;wheel.position.set(0,.45,z);player.add(wheel); const hub=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.22,20),chrome); hub.rotation.z=Math.PI/2;hub.position.set(0,.45,z);player.add(hub); const disc=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.225,24),chrome); disc.rotation.z=Math.PI/2;disc.position.set(0,.45,z);player.add(disc); } box(player,.16,.62,1.2,chrome,0,.86,0); box(player,.58,.43,.68,black,0,.91,.05); box(player,.25,.32,.45,chrome,0,.91,.05); const tank=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),paint); tank.scale.set(cruiser?.37:.34,touring?.28:.30,sport?.53:.43); tank.position.set(0,1.34,-.16);player.add(tank); if(sport){ box(player,.72,.57,.40,paint,0,1.10,-.48); box(player,.48,.38,.20,paint,0,1.35,-.61); box(player,.38,.20,.12,black,0,1.55,-.64); box(player,.08,.42,.20,paint,-.35,1.05,-.44); box(player,.08,.42,.20,paint,.35,1.05,-.44); }else if(cruiser){ box(player,.66,.24,.65,paint,0,1.12,-.30); box(player,.72,.12,.45,black,0,1.12,.40); box(player,.12,.36,.12,chrome,0,1.22,-.48); }else{ box(player,.82,.52,.55,paint,0,1.12,-.43); box(player,.72,.42,.24,paint,0,1.36,-.52); box(player,.90,.24,.45,black,0,1.03,.48); if(touring){ box(player,.22,.48,.35,black,-.52,1.05,.15); box(player,.22,.48,.35,black,.52,1.05,.15); } } cyl(player,.055,.83,chrome,0,.81,-.75); box(player,.80,.07,.12,chrome,0,1.37,-.83); box(player,sport?.30:.38,.18,.10,material(0xfff1b5,.2),0,1.18,-.73); box(player,.18,.11,.08,material(0xf01828),0,.96,.98); for(const s of [-1,1]){ cyl(player,.025,.28,chrome,s*.34,1.43,-.55,.4); box(player,.14,.09,.07,black,s*.37,1.56,-.55); cyl(player,.075,.64,jacket,s*.25,1.80,-.24,.8); cyl(player,.09,.58,jacket,s*.17,1.30,.43,.55); } const body=new THREE.Mesh(new THREE.SphereGeometry(.30,18,14),jacket); body.scale.set(.95,1.30,.75);body.position.set(0,1.85,.20);player.add(body); const head=new THREE.Mesh(new THREE.SphereGeometry(.24,20,16),helmetMat); head.scale.set(1,1.05,1.05);head.position.set(0,2.28,.02);player.add(head); player.position.set(0,0,3);scene.add(player); } /* TRAFFIC CARS */ const traffic=[]; const carColors=[0xc9252d,0xf5f5f5,0x1765a5,0x22252b,0xc9a21b,0x287b45,0x88949c,0x7d3c98]; const carGlass=material(0x83c8df,.22,.15),dark=material(0x17191b); const lamp=material(0xfff2c2,.2),tailLamp=material(0xff1515,.2); function makeCar(z){ const g=new THREE.Group(); const paint=material(carColors[Math.floor(Math.random()*carColors.length)],.3,.25); const type=Math.floor(Math.random()*3); const w=type===1?1.9:1.65,len=type===2?3.8:3.1,h=type===1?1.1:.85; box(g,w,.48,len,paint,0,.65,0); box(g,w*.72,h*.58,len*.48,paint,0,1.05,-.22); box(g,w*.65,h*.43,len*.42,carGlass,0,1.10,-.20); box(g,w*.76,.08,.18,paint,0,.90,-len*.35); box(g,w*.76,.08,.18,paint,0,.90,len*.35); for(const x of [-w*.32,w*.32]){ box(g,.12,.15,.08,lamp,x,.73,-len/2-.02); box(g,.13,.16,.08,tailLamp,x,.73,len/2+.02); } for(const x of [-w*.48,w*.48])for(const zz of [-len*.32,len*.32]){ const tire=new THREE.Mesh(new THREE.CylinderGeometry(.31,.31,.18,20),rubber); tire.rotation.z=Math.PI/2;tire.position.set(x,.36,zz);g.add(tire); const hub=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.19,16),chrome); hub.rotation.z=Math.PI/2;hub.position.set(x,.36,zz);g.add(hub); } box(g,.48,.16,.06,dark,0,.60,-len/2-.04); for(const s of [-1,1])box(g,.12,.08,.17,paint,s*w*.43,1.30,-.15); g.position.set([-4,0,4][Math.floor(Math.random()*3)],0,z); scene.add(g);traffic.push({mesh:g,z,speed:.45+Math.random()*.6}); } for(let i=0;i<10;i++)makeCar(-25-i*25); /* SOUND */ let audio=null,engineOsc=null,engineGain=null,soundOn=true; function initAudio(){ if(audio)return; try{ audio=new(window.AudioContext||window.webkitAudioContext)(); engineOsc=audio.createOscillator();engineGain=audio.createGain(); engineOsc.type='sawtooth';engineGain.gain.value=0; engineOsc.connect(engineGain);engineGain.connect(audio.destination);engineOsc.start(); }catch(e){} } function beep(freq,duration,volume=.15){ if(!soundOn)return;initAudio();if(!audio)return; if(audio.state==='suspended')audio.resume(); const o=audio.createOscillator(),g=audio.createGain(); o.type='square';o.frequency.value=freq; g.gain.setValueAtTime(volume,audio.currentTime); g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration); o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration); } function updateEngine(){ if(!audio||!engineOsc||!engineGain)return; const active=started&&!paused&&!crashed&&soundOn; engineOsc.frequency.setTargetAtTime(65+speed*2.1,audio.currentTime,.08); engineGain.gain.setTargetAtTime(active?Math.min(.035,.006+speed*.00012):0,audio.currentTime,.08); } /* GAME */ let speed=0,distance=0,level=1,steer=0; let gas=false,braking=false,started=false,paused=false,crashed=false; let last=performance.now(); function updateHUD(){ $('speed').textContent=Math.round(speed); $('distance').textContent=Math.floor(distance); $('level').textContent=level; } function resetGame(){ speed=0;distance=0;level=1;steer=0;gas=false;braking=false; crashed=false;paused=false;$('pause').textContent='PAUSE'; for(const c of traffic){ c.z=-25-Math.random()*230;c.mesh.position.z=c.z; c.mesh.position.x=[-4,0,4][Math.floor(Math.random()*3)]; } player.position.x=0;updateHUD(); } function endCrash(){ if(crashed)return; crashed=true;speed=0;gas=false;braking=false;beep(90,.5,.22); $('message').textContent='CRASH! Press RESTART to play again.'; $('title').textContent='💥 CRASH!';$('start').textContent='RESTART'; $('menu').style.display='flex'; } function animate(now){ requestAnimationFrame(animate); const dt=Math.min((now-last)/1000,.05);last=now; if(started&&!paused&&!crashed){ if(gas)speed+=65*dt; else speed-=48*dt; if(braking)speed-=90*dt; speed=THREE.MathUtils.clamp(speed,0,200); const movement=speed/3.6*dt;distance+=movement; level=Math.min(200,1+Math.floor(distance/120)); player.position.x+=steer*7*dt*(.5+speed/100); player.position.x=THREE.MathUtils.clamp(player.position.x,-5.3,5.3); player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,-steer*.16,.12); for(const d of dashes){d.position.z+=movement;if(d.position.z>15)d.position.z-=370} for(const s of scenery){s.position.z+=movement;if(s.position.z>20)s.position.z-=370} for(const c of traffic){ c.z+=movement*(.85-c.speed*.15); if(c.z>12){ c.z=-220-Math.random()*100; c.mesh.position.x=[-4,0,4][Math.floor(Math.random()*3)]; c.speed=.45+Math.random()*.6; } c.mesh.position.z=c.z; if(Math.abs(c.z-player.position.z)<2.15&&Math.abs(c.mesh.position.x-player.position.x)<1.3)endCrash(); } camera.position.x=THREE.MathUtils.lerp(camera.position.x,player.position.x*.38,.06); camera.position.y=5.2;camera.position.z=10; camera.lookAt(player.position.x*.5,1,-7); updateEngine();updateHUD(); } renderer.render(scene,camera); } /* TOUCH CONTROLS */ function holdButton(id,down,up){ const b=$(id); b.addEventListener('pointerdown',e=>{ e.preventDefault();e.stopPropagation(); try{b.setPointerCapture(e.pointerId)}catch(_){} down(); }); for(const ev of ['pointerup','pointercancel','lostpointercapture']) b.addEventListener(ev,e=>{e.preventDefault();up()}); } holdButton('gas',()=>gas=true,()=>gas=false); holdButton('brake',()=>braking=true,()=>braking=false); holdButton('left',()=>steer=-1,()=>{if(steer===-1)steer=0}); holdButton('right',()=>steer=1,()=>{if(steer===1)steer=0}); $('horn').addEventListener('pointerdown',e=>{ e.preventDefault();e.stopPropagation();beep(520,.35,.22); }); /* Holding an empty area of the game screen accelerates too */ window.addEventListener('pointerdown',e=>{ if(!started||paused||crashed)return; if(e.target.closest('button,select,#menu'))return; gas=true; }); window.addEventListener('pointerup',()=>gas=false); window.addEventListener('pointercancel',()=>gas=false); $('sound').onclick=()=>{ soundOn=!soundOn; $('sound').textContent=soundOn?'🔊 SOUND ON':'🔇 SOUND OFF'; if(soundOn)initAudio();updateEngine(); }; $('pause').onclick=()=>{ if(!started||crashed)return; paused=!paused;$('pause').textContent=paused?'RESUME':'PAUSE'; if(!paused)last=performance.now(); gas=false;braking=false; }; $('bike').onchange=()=>makeBike(Number($('bike').value)); $('start').onclick=()=>{ initAudio();if(audio&&audio.state==='suspended')audio.resume(); makeBike(Number($('bike').value));resetGame();started=true; $('menu').style.display='none';$('title').textContent='🏍️ BIKE TRAFFIC RUSH 3D'; $('message').textContent='Ready to ride?';$('start').textContent='START GAME'; last=performance.now(); }; window.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')steer=-1; if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')steer=1; if(e.key==='ArrowUp'||e.key===' ')gas=true; if(e.key==='ArrowDown')braking=true; if(e.key.toLowerCase()==='h')beep(520,.35,.22); }); window.addEventListener('keyup',e=>{ if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))steer=0; if(e.key==='ArrowUp'||e.key===' ')gas=false; if(e.key==='ArrowDown')braking=false; }); window.addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); }); makeBike(0);updateHUD();requestAnimationFrame(animate); </script> </body> </html>
