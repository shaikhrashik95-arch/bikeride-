<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"> <title>Bike Traffic Rush 3D</title> <style> *{box-sizing:border-box} body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#87ceeb;touch-action:none;color:white} #game{position:fixed;inset:0} #hud{position:fixed;top:10px;left:10px;right:10px;display:none;justify-content:space-between;pointer-events:none;gap:8px} .panel{background:#101b2cdd;border:1px solid #ffffff66;padding:9px 12px;border-radius:12px;font-weight:bold;line-height:1.6} #speed{font-size:24px;color:#ffe45c} .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#071526d9;padding:14px} .card{width:min(420px,100%);max-height:94vh;overflow:auto;background:#14273df5;border:1px solid #ffffff55;border-radius:20px;padding:20px;text-align:center} h1{color:#ffdb4a;font-size:27px;margin:0 0 10px} p{font-size:13px;line-height:1.5;color:#dbe8f5} select,button{width:100%;padding:12px;margin-top:9px;border:0;border-radius:10px;font-size:16px} select{background:white;color:#111} button{font-weight:bold;background:#ffca28;color:#171717} button:active{transform:scale(.97)} .secondary{background:#344b64;color:white} #status{color:#ffdf70;font-size:12px;overflow-wrap:anywhere;margin-top:8px} .small{font-size:12px;color:#c3d3e4} #controls{display:none;position:fixed;bottom:14px;left:10px;right:10px;justify-content:space-between;align-items:end;gap:6px} .group{display:flex;gap:7px;align-items:end} .ctrl{width:58px;height:60px;padding:0;margin:0;background:#13243cdd;color:white;border:2px solid #ffffff88;font-size:24px;touch-action:none;user-select:none} .gas{width:70px;height:72px;background:#169c58} .brake{background:#c63d48} .horn{width:52px;height:52px;font-size:12px;background:#4268a8} #over{display:none} </style> </head> <body> <div id="game"></div> <div id="hud"> <div class="panel">🏁 LEVEL <span id="level">1</span>/200<br>🏆 <span id="score">0</span></div> <div class="panel" style="text-align:right"><span id="speed">0</span> km/h<br><span id="state">READY</span></div> </div> <div id="menu" class="overlay"> <div class="card"> <h1>🏍️ BIKE TRAFFIC RUSH 3D</h1> <p>Choose a bike, dodge traffic and race through 200 levels!</p> <label for="bike">SELECT YOUR BIKE</label> <select id="bike"> <option value="0">1. Street Racer</option> <option value="1">2. Super Sport</option> <option value="2">3. Red Thunder</option> <option value="3">4. Blue Phantom</option> <option value="4">5. Green Ninja</option> <option value="5">6. Golden Beast</option> <option value="6">7. Police Bike</option> <option value="7">8. Touring Bike</option> <option value="8">9. City Scooter</option> <option value="9">10. Racing Pro</option> <option value="10">11. Shadow Black</option> <option value="11">12. Orange Bolt</option> <option value="12">13. White Falcon</option> <option value="13">14. Purple Storm</option> <option value="14">15. Classic Cruiser</option> <option value="15">16. Extreme Racer</option> </select> <button id="start">▶ START GAME</button> <button id="sound" class="secondary">🔊 SOUND: ON</button> <div id="status"></div> <p class="small">Hold GAS to accelerate. Release to slow down.<br>LEFT / RIGHT to steer · BRAKE to slow down.</p> </div> </div> <div id="controls"> <div class="group"> <button class="ctrl" id="left">◀</button> <button class="ctrl" id="right">▶</button> </div> <div class="group"> <button class="ctrl horn" id="horn">HORN</button> <button class="ctrl brake" id="brake">▼</button> <button class="ctrl gas" id="gas">GAS</button> </div> </div> <div id="over" class="overlay"> <div class="card"> <h1 id="resultTitle">GAME OVER</h1> <p id="resultText"></p> <button id="restart">↻ PLAY AGAIN</button> <button id="home" class="secondary">MAIN MENU</button> </div> </div> <script type="module"> import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js'; const $=id=>document.getElementById(id); const colors=[ 0xe53935,0xeceff1,0xf52222,0x1677ff, 0x23c552,0xffca28,0x17202a,0x999999, 0x32c8d7,0xff3c81,0x151515,0xff7918, 0xf5f5f5,0x9b4dff,0x70452b,0xff2020 ]; let scene,camera,renderer,player; let running=false,soundOn=true,audio=null,osc=null,gain=null; let speed=0,distance=0,score=0,level=1,elapsed=0; let gasOn=false,brakeOn=false,leftOn=false,rightOn=false; let cars=[],trees=[],marks=[]; let last=0,spawn=0,crash=0; function mat(color,roughness=.7){ return new THREE.MeshStandardMaterial({color,roughness}); } const roadMat=mat(0x30343a),whiteMat=mat(0xffffff); const grassMat=mat(0x398446),trunkMat=mat(0x765034); const leafMat=mat(0x246b35),tireMat=mat(0x161616); const metalMat=mat(0x9ca9b6,.35),glassMat=mat(0x8bd7f3,.3); const lampMat=mat(0xffdf65),redMat=mat(0xe53935); function addBox(parent,w,h,d,material,x,y,z){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material); m.position.set(x,y,z);parent.add(m);return m; } function addCylinder(parent,r,h,material,x,y,z,rot=0){ const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),material); m.position.set(x,y,z);m.rotation.z=rot;parent.add(m);return m; } function makeWheel(parent,x,z){ const w=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,.16,16),tireMat); w.rotation.z=Math.PI/2;w.position.set(x,.36,z);parent.add(w); const hub=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.18,12),metalMat); hub.rotation.z=Math.PI/2;hub.position.copy(w.position);parent.add(hub); } function makeBike(index){ const g=new THREE.Group(); const body=mat(colors[index],.35); makeWheel(g,0,-.82);makeWheel(g,0,.82); addBox(g,.48,.34,1.05,body,0,.8,0); addBox(g,.4,.15,.48,mat(0x171717),0,1.04,.05); addBox(g,.45,.13,.32,metalMat,0,1.13,-.22); addBox(g,.48,.18,.3,body,0,.76,-.55); addCylinder(g,.045,.65,metalMat,0,.72,-.65); addBox(g,.72,.06,.08,metalMat,0,1.19,-.65); addBox(g,.15,.09,.12,lampMat,0,1.02,-.88); addCylinder(g,.07,.62,metalMat,.29,.54,.12,Math.PI/2); addCylinder(g,.07,.62,metalMat,-.29,.54,.12,Math.PI/2); addCylinder(g,.23,.5,mat(0x202b38),0,1.46,.12); const helmet=new THREE.Mesh(new THREE.SphereGeometry(.22,14,12),body); helmet.position.set(0,1.85,-.02);g.add(helmet); g.position.set(0,0,2);scene.add(g);return g; } function makeCar(){ const g=new THREE.Group(); const cs=[0xf44336,0x2196f3,0xf4f4f4,0xffc107,0x333333,0x22a06b]; const body=mat(cs[Math.floor(Math.random()*cs.length)],.35); addBox(g,1.5,.62,2.6,body,0,.7,0); addBox(g,1.15,.5,1.35,glassMat,0,1.22,-.12); addBox(g,1.28,.1,.12,redMat,0,.82,1.32); addBox(g,1.28,.1,.12,lampMat,0,.82,-1.32); for(const x of [-.78,.78])for(const z of [-.8,.8]){ const w=new THREE.Mesh(new THREE.CylinderGeometry(.23,.23,.15,12),tireMat); w.rotation.z=Math.PI/2;w.position.set(x,.32,z);g.add(w); } scene.add(g);return g; } function makeTree(x,z){ const g=new THREE.Group(); addCylinder(g,.14,1.3,trunkMat,0,.65,0); const crown=new THREE.Mesh(new THREE.ConeGeometry(.8,2,8),leafMat); crown.position.y=2.1;g.add(crown); g.position.set(x,0,z);scene.add(g);return g; } function initScene(){ scene=new THREE.Scene(); scene.background=new THREE.Color(0x87ceeb); scene.fog=new THREE.Fog(0x87ceeb,45,180); camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300); camera.position.set(0,5.1,9.8); camera.lookAt(0,1,-5); renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5)); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace; $('game').replaceChildren(renderer.domElement); scene.add(new THREE.HemisphereLight(0xffffff,0x45603b,2)); const sun=new THREE.DirectionalLight(0xffffff,2); sun.position.set(-8,15,8);scene.add(sun); const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,320),grassMat); ground.rotation.x=-Math.PI/2;ground.position.set(0,-.08,-100);scene.add(ground); const road=new THREE.Mesh(new THREE.PlaneGeometry(10,320),roadMat); road.rotation.x=-Math.PI/2;road.position.set(0,0,-100);scene.add(road); for(const x of [-4.7,4.7]){ const edge=new THREE.Mesh(new THREE.BoxGeometry(.12,.025,320),whiteMat); edge.position.set(x,.025,-100);scene.add(edge); } marks=[]; for(let z=-220;z<15;z+=7)for(const x of [-1.65,1.65]){ const m=new THREE.Mesh(new THREE.BoxGeometry(.12,.025,3.1),whiteMat); m.position.set(x,.03,z);scene.add(m);marks.push(m); } trees=[]; for(let z=-220;z<30;z+=10){ trees.push(makeTree(-7-Math.random()*3,z)); trees.push(makeTree(7+Math.random()*3,z-4)); } cars=[]; for(let i=0;i<7;i++){ const c=makeCar(); c.position.set([-3,0,3][i%3],0,-35-i*27);cars.push(c); } player=makeBike(Number($('bike').value)); } function initAudio(){ if(!soundOn)return; try{ if(!audio){ audio=new (window.AudioContext||window.webkitAudioContext)(); osc=audio.createOscillator();gain=audio.createGain(); osc.type='sawtooth';osc.frequency.value=65;gain.gain.value=0; osc.connect(gain);gain.connect(audio.destination);osc.start(); } if(audio.state==='suspended')audio.resume(); }catch(e){} } function beep(freq=440,duration=.15){ if(!soundOn)return; try{ initAudio();if(!audio)return; const o=audio.createOscillator(),g=audio.createGain(); o.frequency.value=freq;g.gain.setValueAtTime(.18,audio.currentTime); g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration); o.connect(g);g.connect(audio.destination); o.start();o.stop(audio.currentTime+duration); }catch(e){} } function startGame(){ try{ if(!renderer)initScene(); initAudio(); if(player){scene.remove(player);player=null;} player=makeBike(Number($('bike').value)); speed=0;distance=0;score=0;level=1;elapsed=0;spawn=0;crash=0; cars.forEach((c,i)=>c.position.set([-3,0,3][i%3],0,-35-i*27)); running=true;last=performance.now(); $('menu').style.display='none';$('over').style.display='none'; $('hud').style.display='flex';$('controls').style.display='flex'; $('status').textContent=''; }catch(e){ $('status').textContent='Could not start: '+e.message; console.error(e); } } function gameOver(won=false){ running=false; $('controls').style.display='none';$('over').style.display='flex'; $('resultTitle').textContent=won?'🏆 YOU WIN!':'💥 GAME OVER'; $('resultText').textContent='Level '+level+'/200 · Score '+score+' · Distance '+Math.floor(distance)+' m'; } function update(dt){ if(!running)return; elapsed+=dt; if(brakeOn)speed=Math.max(0,speed-115*dt); else if(gasOn)speed=Math.min(200,speed+48*dt); else speed=Math.max(0,speed-24*dt); const movement=speed/3.6*dt; distance+=movement; score=Math.floor(distance*2); level=Math.min(200,1+Math.floor(distance/180)); $('speed').textContent=Math.round(speed); $('score').textContent=score; $('level').textContent=level; $('state').textContent=speed>5?'RACING':'READY'; if(audio&&gain&&osc){ gain.gain.setTargetAtTime(soundOn?.035:0,audio.currentTime,.08); osc.frequency.setTargetAtTime(55+speed*1.4,audio.currentTime,.08); } if(player){ const dir=(leftOn?1:0)-(rightOn?1:0); player.position.x=THREE.MathUtils.clamp(player.position.x+dir*dt*(2.5+speed*.018),-3.8,3.8); player.rotation.z=-dir*.12; player.position.y=Math.sin(elapsed*12)*.015*(speed/200); } marks.forEach(m=>{ m.position.z+=movement; if(m.position.z>12)m.position.z-=224; }); trees.forEach(t=>{ t.position.z+=movement; if(t.position.z>15)t.position.z=-210-Math.random()*20; }); spawn-=dt; if(spawn<=0){ spawn=Math.max(.6,1.8-level*.004); const free=cars.filter(c=>c.position.z < -45); if(free.length){ const c=free[Math.floor(Math.random()*free.length)]; c.position.x=[-3,0,3][Math.floor(Math.random()*3)]; c.position.z=-100-Math.random()*80; } } cars.forEach(c=>{ c.position.z+=movement*1.15; if(c.position.z>12){ c.position.z=-115-Math.random()*70; c.position.x=[-3,0,3][Math.floor(Math.random()*3)]; } if(Math.abs(c.position.x-player.position.x)<1.12&& Math.abs(c.position.z-player.position.z)<1.75&&speed>15){ crash+=dt; if(crash>.12)gameOver(false); } }); camera.position.x+=(player.position.x*.28-camera.position.x)*Math.min(1,dt*2); camera.lookAt(player.position.x*.18,1,-5); if(distance>=35820)gameOver(true); } function animate(now){ requestAnimationFrame(animate); const dt=Math.min(.05,Math.max(0,(now-last)/1000)); last=now; if(running)update(dt); if(renderer&&scene&&camera)renderer.render(scene,camera); } function setHold(id,value){ if(id==='left')leftOn=value; if(id==='right')rightOn=value; if(id==='gas')gasOn=value; if(id==='brake')brakeOn=value; } ['left','right','gas','brake'].forEach(id=>{ const el=$(id); el.addEventListener('pointerdown',e=>{ e.preventDefault();setHold(id,true); try{el.setPointerCapture(e.pointerId)}catch(err){} }); ['pointerup','pointercancel','lostpointercapture'].forEach(type=>{ el.addEventListener(type,e=>{ e.preventDefault();setHold(id,false); }); }); }); $('horn').addEventListener('pointerdown',e=>{ e.preventDefault();beep(580,.22); setTimeout(()=>beep(760,.2),100); }); $('start').addEventListener('click',startGame); $('restart').addEventListener('click',startGame); $('home').addEventListener('click',()=>{ running=false; $('over').style.display='none'; $('hud').style.display='none'; $('menu').style.display='flex'; }); $('sound').addEventListener('click',()=>{ soundOn=!soundOn; $('sound').textContent=soundOn?'🔊 SOUND: ON':'🔇 SOUND: OFF'; if(!soundOn&&gain&&audio)gain.gain.setTargetAtTime(0,audio.currentTime,.05); if(soundOn)initAudio(); }); window.addEventListener('resize',()=>{ if(camera&&renderer){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); } }); window.addEventListener('blur',()=>{ leftOn=false;rightOn=false;gasOn=false;brakeOn=false; }); try{ initScene(); requestAnimationFrame(animate); }catch(e){ $('status').textContent='3D loading error: '+e.message; console.error(e); } </script> </body> </html>
