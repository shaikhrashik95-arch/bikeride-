<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"> <title>Bike Traffic Rush 3D</title> <style> *{box-sizing:border-box} body{margin:0;overflow:hidden;font-family:Arial;background:#87ceeb;touch-action:none} canvas{display:block} #hud{position:fixed;top:10px;left:8px;right:8px;display:flex;justify-content:space-between;gap:5px;color:white;font-weight:bold;pointer-events:none} .stat{background:#000a;padding:9px 7px;border-radius:9px;text-align:center;font-size:12px} button,select{border:0;border-radius:10px;padding:12px;background:#17212b;color:white;font-weight:bold} #top{position:fixed;right:8px;top:65px;display:flex;gap:6px} #controls{position:fixed;bottom:15px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px} .pad{display:flex;gap:8px} .ctrl{width:58px;height:58px;border-radius:50%;font-size:22px;background:#111c;color:white;border:2px solid #ffffff99;touch-action:none} #horn{font-size:12px} #menu{position:fixed;inset:0;background:#071522bb;display:flex;align-items:center;justify-content:center;padding:15px;color:white} .panel{width:min(400px,100%);background:#101b26f5;border-radius:18px;padding:20px;text-align:center} h1{color:#ffd54a;font-size:25px} p{font-size:14px;line-height:1.5} select{width:100%;margin:8px 0} #start{width:100%;background:#ff7900;font-size:18px;margin-top:10px} #msg{color:#ffd54a;min-height:20px} #hint{position:fixed;bottom:82px;left:0;right:0;text-align:center;color:white;font-size:12px;text-shadow:0 2px 3px black;pointer-events:none} </style> </head> <body> <div id="hud"> <div class="stat">SPEED<br><span id="speed">0</span> km/h</div> <div class="stat">LEVEL<br><span id="level">1</span>/200</div> <div class="stat">DISTANCE<br><span id="dist">0</span> m</div> </div> <div id="top"> <button id="sound">🔊 SOUND ON</button> <button id="pause">Ⅱ</button> </div> <div id="hint">◀ ▶ STEER • ▲ ACCELERATE • ▼ BRAKE</div> <div id="controls"> <div class="pad"> <button class="ctrl" id="left">◀</button> <button class="ctrl" id="right">▶</button> </div> <div class="pad"> <button class="ctrl" id="horn">HORN</button> <button class="ctrl" id="brake">▼</button> <button class="ctrl" id="gas">▲</button> </div> </div> <div id="menu"> <div class="panel"> <h1 id="title">🏍️ BIKE TRAFFIC RUSH 3D</h1> <p>Choose your bike and race through traffic!</p> <select id="bike"> <option value="0">01 Racing Red</option> <option value="1">02 Ocean Blue</option> <option value="2">03 Neon Green</option> <option value="3">04 Golden Yellow</option> <option value="4">05 Purple Storm</option> <option value="5">06 Orange Flash</option> <option value="6">07 White Phantom</option> <option value="7">08 Black Shadow</option> <option value="8">09 Pink Nitro</option> <option value="9">10 Cyan Wave</option> <option value="10">11 Silver Bullet</option> <option value="11">12 Lime Racer</option> <option value="12">13 Magenta Rush</option> <option value="13">14 Bronze Rider</option> <option value="14">15 Ice Blue</option> <option value="15">16 Emerald</option> </select> <p>MAX SPEED: 250 km/h<br>200 Levels • 3D Traffic • Engine Sound</p> <div id="msg">Ready to ride?</div> <button id="start">START RIDE</button> </div> </div> <script type="module"> import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js'; const scene=new THREE.Scene(); scene.background=new THREE.Color(0x87ceeb); scene.fog=new THREE.Fog(0x87ceeb,65,260); const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,600); camera.position.set(0,5,10); const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,1.7)); renderer.shadowMap.enabled=true; document.body.appendChild(renderer.domElement); scene.add(new THREE.HemisphereLight(0xffffff,0x536044,2)); const sun=new THREE.DirectionalLight(0xffffff,2); sun.position.set(-15,30,10); sun.castShadow=true; scene.add(sun); const material=(c,r=.8,m=0)=> new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m}); const geo=new THREE.BoxGeometry(1,1,1); function box(parent,w,h,d,mat,x,y,z){ const o=new THREE.Mesh(geo,mat); o.scale.set(w,h,d); o.position.set(x,y,z); o.castShadow=true; o.receiveShadow=true; parent.add(o); return o; } function cylinder(parent,r,h,mat,x,y,z,rx=0,rz=0){ const o=new THREE.Mesh( new THREE.CylinderGeometry(r,r,h,14),mat); o.position.set(x,y,z); o.rotation.set(rx,0,rz); o.castShadow=true; parent.add(o); return o; } /* ROAD */ const grass=material(0x438b3b); const asphalt=material(0x34383e); const white=material(0xf8f5dc); const metal=material(0x89959e,.4,.6); box(scene,400,.3,600,grass,0,-.35,-130); const road=new THREE.Group(); scene.add(road); box(road,13,.16,320,asphalt,0,-.12,-130); box(road,.2,.04,320,white,-6.3,-.015,-130); box(road,.2,.04,320,white,6.3,-.015,-130); const dashes=[]; for(let z=20;z>-300;z-=8){ for(const x of [-2.1,2.1]){ dashes.push(box(road,.12,.035,3.5,white,x,-.015,z)); } } for(const x of [-7,7]){ box(road,.18,.5,320,metal,x,.1,-130); for(let z=15;z>-300;z-=18) box(road,.22,.6,.25,metal,x,.05,z); } /* ROADSIDE TREES AND BUILDINGS */ const scenery=[]; const trunk=material(0x704522); const leaves=[material(0x28703b),material(0x388b48)]; const buildings=[ material(0xc6b7a0),material(0x8fa6b5), material(0xd1c5b5),material(0xb3b5b8) ]; const windows=material(0x91d9f2,.35,.1); function tree(x,z){ const g=new THREE.Group(); g.position.set(x,0,z); cylinder(g,.14,1.5,trunk,0,.75,0); const a=new THREE.Mesh( new THREE.ConeGeometry(.95,2.2,8),leaves[0]); a.position.y=2.1; g.add(a); const b=new THREE.Mesh( new THREE.ConeGeometry(.65,1.5,8),leaves[1]); b.position.y=2.8; g.add(b); scene.add(g); scenery.push(g); } function building(x,z){ const g=new THREE.Group(); const w=3+Math.random()*3; const h=4+Math.random()*9; const d=3+Math.random()*3; g.position.set(x,h/2,z); box(g,w,h,d,buildings[Math.floor(Math.random()*buildings.length)],0,0,0); for(let y=-h/2+.8;y<h/2-.3;y+=1.4){ for(let xx=-w/2+.5;xx<w/2-.2;xx+=1.1){ box(g,.42,.6,.04,windows,xx,y,d/2+.03); } } scene.add(g); scenery.push(g); } for(let z=25;z>-300;z-=12){ for(const s of [-1,1]){ const x=s*(10+Math.random()*10); if(Math.random()<.65)tree(x,z-Math.random()*7); else building(x,z-Math.random()*7); } } /* 16 BIKE COLOURS */ const colors=[ 0xe53935,0x1677ff,0x39d353,0xffd600, 0x8e44ad,0xff7800,0xf4f7fa,0x20252b, 0xff4fa3,0x00cfe8,0xaeb7c1,0xb4ed21, 0xe000a5,0xb87333,0x9cecff,0x008f62 ]; const rubber=material(0x08090a); const chrome=material(0xbec8d0,.3,.7); let player=new THREE.Group(); function buildBike(index){ scene.remove(player); player=new THREE.Group(); const paint=material(colors[index],.28,.35); const black=material(0x15191d); const jacket=material(0x202d42); const helmet=material(0xf2f5f7,.3,.2); for(const z of [-.95,.9]){ const wheel=new THREE.Mesh( new THREE.CylinderGeometry(.42,.42,.18,20),rubber); wheel.rotation.z=Math.PI/2; wheel.position.set(0,.48,z); player.add(wheel); const hub=new THREE.Mesh( new THREE.CylinderGeometry(.18,.18,.2,16),chrome); hub.rotation.z=Math.PI/2; hub.position.set(0,.48,z); player.add(hub); } box(player,.52,.45,1.25,paint,0,1.05,0); box(player,.4,.28,.48,black,0,1.38,-.05); const tank=new THREE.Mesh( new THREE.SphereGeometry(.38,16,12),paint); tank.scale.set(.85,.72,1.1); tank.position.set(0,1.43,-.18); player.add(tank); box(player,.12,.75,.12,chrome,0,1,.72); box(player,.8,.08,.12,chrome,0,1.48,.95); box(player,.34,.16,.25,material(0xfff3b0),0,1.1,-.68); box(player,.22,.12,.08,material(0xe21e2b),0,1,1); const body=new THREE.Mesh( new THREE.SphereGeometry(.34,12,12),jacket); body.scale.set(.9,1.35,.72); body.position.set(0,1.95,.18); player.add(body); const head=new THREE.Mesh( new THREE.SphereGeometry(.25,16,12),helmet); head.position.set(0,2.38,-.02); player.add(head); for(const s of [-1,1]){ cylinder(player,.1,.72,jacket,s*.29,1.88,-.3,Math.PI/2); cylinder(player,.12,.65,black,s*.18,1.25,.55,.5); } player.position.set(0,0,3); scene.add(player); } /* TRAFFIC */ const traffic=[]; const carColors=[0xff4d4d,0xffc107,0x42a5f5,0xeeeeee,0x222831,0x28a745]; function makeCar(z){ const g=new THREE.Group(); const paint=material(carColors[Math.floor(Math.random()*carColors.length)],.35,.1); box(g,1.55,.65,2.7,paint,0,.65,0); box(g,1.2,.58,1.25,material(0x7fc5dd,.3,.1),0,1.18,-.15); for(const x of [-.82,.82]){ for(const zz of [-.82,.82]){ const w=new THREE.Mesh( new THREE.CylinderGeometry(.25,.25,.16,12),rubber); w.rotation.z=Math.PI/2; w.position.set(x,.32,zz); g.add(w); } } g.position.set([-4,0,4][Math.floor(Math.random()*3)],0,z); scene.add(g); traffic.push(g); } for(let i=0;i<9;i++)makeCar(-35-i*28); /* GAME STATE */ let speed=0,distance=0,level=1,laneX=0,steer=0; let gas=false,brake=false,running=false,paused=false; let soundOn=true,audio=null,osc=null,gain=null; const $=id=>document.getElementById(id); function hud(){ $('speed').textContent=Math.round(speed); $('level').textContent=level; $('dist').textContent=Math.floor(distance); } function startSound(){ if(!soundOn)return; try{ if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)(); if(audio.state==='suspended')audio.resume(); if(!osc){ osc=audio.createOscillator(); gain=audio.createGain(); osc.type='sawtooth'; osc.frequency.value=60; gain.gain.value=0; osc.connect(gain); gain.connect(audio.destination); osc.start(); } }catch(e){} } function tone(freq,duration,type='sine',volume=.12){ if(!soundOn)return; try{ startSound(); if(!audio)return; const o=audio.createOscillator(); const g=audio.createGain(); o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(volume,audio.currentTime); g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration); o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime+duration); }catch(e){} } function updateSound(){ if(osc&&audio){ osc.frequency.setTargetAtTime(45+speed*.85,audio.currentTime,.08); gain.gain.setTargetAtTime( running&&!paused&&soundOn?.025:0,audio.currentTime,.12); } } function startGame(){ buildBike(Number($('bike').value)); speed=0;distance=0;level=1;laneX=0;steer=0; gas=false;brake=false;paused=false;running=true; $('menu').style.display='none'; $('pause').textContent='Ⅱ'; startSound(); hud(); updateSound(); } function crash(){ running=false; speed=0; $('menu').style.display='flex'; $('title').textContent='💥 CRASH!'; $('msg').textContent='Distance: '+Math.floor(distance)+' m • Level '+level; $('start').textContent='RIDE AGAIN'; tone(100,.6,'sawtooth',.2); updateSound(); } $('start').onclick=()=>{ $('title').textContent='🏍️ BIKE TRAFFIC RUSH 3D'; $('msg').textContent='Ready to ride?'; $('start').textContent='START RIDE'; startGame(); }; $('pause').onclick=()=>{ if(!running)return; paused=!paused; $('pause').textContent=paused?'▶':'Ⅱ'; gas=false;brake=false; updateSound(); }; $('sound').onclick=()=>{ soundOn=!soundOn; $('sound').textContent=soundOn?'🔊 SOUND ON':'🔇 SOUND OFF'; if(soundOn)startSound(); updateSound(); }; /* MOBILE BUTTONS */ function hold(id,down,up){ const el=$(id); el.addEventListener('pointerdown',e=>{ e.preventDefault(); down(); try{el.setPointerCapture(e.pointerId)}catch(err){} }); for(const ev of ['pointerup','pointercancel','lostpointercapture']){ el.addEventListener(ev,e=>{ e.preventDefault(); up(); }); } } hold('left',()=>steer=-1,()=>{if(steer===-1)steer=0}); hold('right',()=>steer=1,()=>{if(steer===1)steer=0}); hold('gas',()=>gas=true,()=>gas=false); hold('brake',()=>brake=true,()=>brake=false); $('horn').addEventListener('pointerdown',e=>{ e.preventDefault(); tone(440,.25,'square',.16); setTimeout(()=>tone(350,.25,'square',.12),120); }); addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'||e.key==='a')steer=-1; if(e.key==='ArrowRight'||e.key==='d')steer=1; if(e.key==='ArrowUp'||e.key==='w')gas=true; if(e.key==='ArrowDown'||e.key==='s')brake=true; if(e.key===' ')tone(440,.25,'square',.16); }); addEventListener('keyup',e=>{ if(['ArrowLeft','a','ArrowRight','d'].includes(e.key))steer=0; if(['ArrowUp','w'].includes(e.key))gas=false; if(['ArrowDown','s'].includes(e.key))brake=false; }); let last=performance.now(); function animate(now){ requestAnimationFrame(animate); const dt=Math.min((now-last)/1000,.05); last=now; if(running&&!paused){ if(gas)speed=Math.min(250,speed+72*dt); else speed=Math.max(42,speed-9*dt); if(brake)speed=Math.max(0,speed-115*dt); distance+=speed/3.6*dt; level=Math.min(200,1+Math.floor(distance/120)); laneX+=steer*7.5*dt; laneX=THREE.MathUtils.clamp(laneX,-4.7,4.7); player.position.x=THREE.MathUtils.damp(player.position.x,laneX,7,dt); player.rotation.z=THREE.MathUtils.damp(player.rotation.z,-steer*.16,5,dt); const travel=speed/3.6*dt; for(const o of scenery){ o.position.z+=travel; if(o.position.z>25)o.position.z-=300; } for(const d of dashes){ d.position.z+=travel; if(d.position.z>24)d.position.z-=320; } for(const car of traffic){ car.position.z+=travel*.85; if(car.position.z>12){ car.position.z=-210-Math.random()*100; car.position.x=[-4,0,4][Math.floor(Math.random()*3)]; } if(Math.abs(car.position.z-player.position.z)<1.8&& Math.abs(car.position.x-player.position.x)<1.25){ crash(); break; } } hud(); updateSound(); } camera.position.x=THREE.MathUtils.damp(camera.position.x,player.position.x*.32,3,dt); camera.lookAt(player.position.x*.35,1.1,-5); renderer.render(scene,camera); } buildBike(0); requestAnimationFrame(animate); addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); }); </script> </body> </html>
