<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"> <title>Bike Traffic Rush 3D</title> <style> *{box-sizing:border-box} body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif;color:white;touch-action:none} canvas{display:block} #hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:2} .panel{background:#101827dd;padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.7} #menu{position:fixed;inset:0;background:#06111ddd;z-index:5;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px} #menu .card{width:min(440px,100%);background:#15253a;border:1px solid #526a85;border-radius:20px;padding:22px;max-height:94vh;overflow:auto} h1{font-size:27px;margin:4px 0 12px;color:#ffd43b} button,select{border:0;border-radius:10px;padding:12px;background:#253d59;color:white;font-size:15px;font-weight:bold} select{width:100%;margin:8px 0} #start{width:100%;background:#20b85a;font-size:21px;margin-top:10px} #controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 15px;z-index:3;pointer-events:none} .group{display:flex;gap:10px;pointer-events:auto} .control{width:64px;height:64px;border-radius:50%;background:#142337cc;border:2px solid #ffffffaa;font-size:25px;touch-action:none} .control.gas{background:#149447e8}.control.brake{background:#c43b36e8} #hint{font-size:12px;color:#c8d5e5} #sound{position:fixed;top:94px;right:10px;z-index:4;background:#101827dd} </style> </head> <body> <div id="hud"> <div class="panel">🏍️ <b>BIKE RUSH 3D</b><br>Speed: <b id="speed">0</b> km/h</div> <div class="panel">Level: <b id="level">1</b>/200<br>Score: <b id="score">0</b></div> </div> <button id="sound">🔊 SOUND ON</button> <div id="menu"> <div class="card"> <h1>🏍️ BIKE TRAFFIC RUSH 3D</h1> <p>Ride through traffic. Avoid cars. Reach 200 levels!</p> <label for="bike">SELECT BIKE</label> <select id="bike"> <option value="0">1. Sport Racer</option> <option value="1">2. Super Sport</option> <option value="2">3. Street Fighter</option> <option value="3">4. Touring Bike</option> <option value="4">5. Cruiser</option> <option value="5">6. Racing Red</option> <option value="6">7. Racing Blue</option> <option value="7">8. Racing Green</option> <option value="8">9. Classic Bike</option> <option value="9">10. Naked Bike</option> <option value="10">11. Adventure Bike</option> <option value="11">12. Police Bike</option> <option value="12">13. Gold Edition</option> <option value="13">14. Neon Racer</option> <option value="14">15. Street 600</option> <option value="15">16. Super 1000</option> </select> <p id="hint">Hold GAS to accelerate. Release to slow down.</p> <button id="start">▶ START GAME</button> <p style="font-size:12px;color:#b9c8d8">Landscape mode recommended</p> </div> </div> <div id="controls"> <div class="group"> <button class="control" id="left">◀</button> <button class="control" id="right">▶</button> </div> <div class="group"> <button class="control brake" id="brake">▼</button> <button class="control gas" id="gas">▲</button> <button class="control" id="horn">📣</button> </div> </div> <script type="module"> import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js'; const $=id=>document.getElementById(id); const scene=new THREE.Scene(); scene.background=new THREE.Color(0x83c9f2); scene.fog=new THREE.Fog(0x83c9f2,45,190); const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300); camera.position.set(0,5.3,10.5); camera.lookAt(0,1,0); const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.7)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; document.body.appendChild(renderer.domElement); scene.add(new THREE.HemisphereLight(0xd9efff,0x536044,2)); const sun=new THREE.DirectionalLight(0xffffff,2.2); sun.position.set(-10,18,7); sun.castShadow=true; scene.add(sun); function mat(color,roughness=.8,metalness=0){ return new THREE.MeshStandardMaterial({color,roughness,metalness}); } const roadMat=mat(0x30343a), grassMat=mat(0x4b9a42); const whiteMat=mat(0xffffff), darkMat=mat(0x15191f); const road=new THREE.Mesh(new THREE.PlaneGeometry(12,260),roadMat); road.rotation.x=-Math.PI/2;road.position.set(0,-.08,-85);scene.add(road); const ground=new THREE.Mesh(new THREE.PlaneGeometry(250,300),grassMat); ground.rotation.x=-Math.PI/2;ground.position.set(0,-.16,-80);scene.add(ground); const laneMarks=[]; for(let z=-205;z<30;z+=7){ for(const x of [-2,2]){ const m=new THREE.Mesh(new THREE.BoxGeometry(.12,.025,3.2),whiteMat); m.position.set(x,.005,z);scene.add(m);laneMarks.push(m); } } for(const x of [-6.05,6.05]){ const edge=new THREE.Mesh(new THREE.BoxGeometry(.18,.04,260),whiteMat); edge.position.set(x,.02,-85);scene.add(edge); } function box(parent,w,h,d,color,x,y,z,material=null){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material||mat(color)); m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m; } function cylinder(parent,r1,r2,h,color,x,y,z,segments=12){ const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),mat(color)); m.position.set(x,y,z);m.rotation.z=Math.PI/2;m.castShadow=true;parent.add(m);return m; } function makeTree(x,z){ const g=new THREE.Group(); cylinder(g,.17,.23,1.6,0x684326,0,.8,0); const crown=new THREE.Mesh(new THREE.ConeGeometry(1.15,2.6,7),mat(0x23753a)); crown.position.y=2.55;g.add(crown); const crown2=new THREE.Mesh(new THREE.ConeGeometry(.8,1.9,7),mat(0x368c42)); crown2.position.y=3.35;g.add(crown2); g.position.set(x,0,z);scene.add(g);return g; } function makeBuilding(x,z){ const g=new THREE.Group(); const h=5+Math.random()*10; box(g,4,h,4,0xc1c9d2,0,h/2,0); for(let y=1;y<h-1;y+=1.7){ for(const xx of [-1.15,0,1.15]){ box(g,.48,.65,.035,0x70b9df,xx,y,2.02); } } g.position.set(x,0,z);scene.add(g);return g; } const scenery=[]; for(let z=-210;z<25;z+=12){ for(const side of [-1,1]){ scenery.push(Math.random()<.7?makeTree(side*(9+Math.random()*5),z):makeBuilding(side*(12+Math.random()*6),z)); } } const bikeColors=[0xff2020,0x1565ff,0xeeeeee,0xffa500,0x171717,0xd50000,0x00a5ff,0x19a34a,0x9b6237,0x343b46,0xe0d7bd,0xeeeeee,0xffc400,0xff00c8,0x00c9b0,0x762bdb]; let player,selectedBike=0; function makeBike(index){ const g=new THREE.Group(); const color=bikeColors[index]||0xff2020; const paint=mat(color,.3,.35); const rubber=mat(0x111111); const metal=mat(0x8a929b,.25,.8); // wheels for(const z of [-.85,.85]){ const wheel=new THREE.Mesh(new THREE.TorusGeometry(.39,.12,10,20),rubber); wheel.rotation.y=Math.PI/2;wheel.position.set(0,.43,z);g.add(wheel); const hub=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.15,12),metal); hub.rotation.z=Math.PI/2;hub.position.set(0,.43,z);g.add(hub); } // body and engine box(g,.48,.42,1.2,color,0,.9,0,paint); box(g,.58,.45,.5,0x626970,0,.75,.1,metal); box(g,.52,.22,.75,0x171b22,0,1.12,-.12); // tank const tank=new THREE.Mesh(new THREE.SphereGeometry(.42,16,12),paint); tank.scale.set(.72,.65,1.05);tank.position.set(0,1.28,.05);g.add(tank); // front cowl and windscreen box(g,.5,.48,.28,color,0,1.35,.73,paint); box(g,.3,.22,.06,0x9bdcf4,0,1.65,.78); // headlight box(g,.25,.15,.07,0xfff1ae,0,1.23,.89); // seat box(g,.43,.16,.65,0x171717,0,1.24,-.48); // fork and handlebar for(const x of [-.2,.2]){ const fork=cylinder(g,.045,.045,.85,0x9ca6b0,x,.88,.65); fork.rotation.x=.15; } box(g,1.0,.065,.08,0x262b31,0,1.52,.55); // mirrors for(const x of [-.39,.39]){ box(g,.06,.34,.06,0x333941,x,1.62,.45); box(g,.18,.12,.08,0x181d23,x,1.8,.45); } // rear lights and exhaust box(g,.22,.1,.06,0xff2b2b,0,1.28,-.84); cylinder(g,.08,.1,.75,0x777d84,.29,.68,-.28); // rider helmet/body const rider=mat(index===11?0xffffff:0x202b3b,.4); box(g,.46,.62,.32,0x1d2938,0,1.75,-.05,rider); const helmet=new THREE.Mesh(new THREE.SphereGeometry(.25,14,12),mat(index===11?0xffffff:color,.3)); helmet.position.set(0,2.2,.12);g.add(helmet); box(g,.3,.13,.15,0x101820,0,2.18,.31); g.position.set(0,0,3); scene.add(g);return g; } let traffic=[],running=false,gameOver=false; let speed=0,score=0,level=1; let gasOn=false,brakeOn=false,leftOn=false,rightOn=false; let soundOn=true,audio=null,engineOsc=null,engineGain=null; function initAudio(){ if(audio)return; audio=new (window.AudioContext||window.webkitAudioContext)(); engineOsc=audio.createOscillator(); engineGain=audio.createGain(); engineOsc.type='sawtooth';engineOsc.frequency.value=55; engineGain.gain.value=0; engineOsc.connect(engineGain);engineGain.connect(audio.destination); engineOsc.start(); } function beep(freq=500,duration=.15){ if(!soundOn)return; initAudio(); const o=audio.createOscillator(),v=audio.createGain(); o.frequency.value=freq;o.connect(v);v.connect(audio.destination); v.gain.setValueAtTime(.18,audio.currentTime); v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration); o.start();o.stop(audio.currentTime+duration); } function updateSound(){ if(engineOsc&&audio){ engineOsc.frequency.setTargetAtTime(48+speed*1.05,audio.currentTime,.08); engineGain.gain.setTargetAtTime(soundOn&&running?.035:0,audio.currentTime,.1); } } function makeCar(){ const g=new THREE.Group(); const colors=[0xe43e35,0x287bd1,0xf4f4f4,0x242424,0xf4c542,0x24a56a]; const c=colors[Math.floor(Math.random()*colors.length)]; box(g,1.45,.65,2.35,c,0,.65,0); box(g,1.2,.58,1.15,0x8ec9e8,0,1.17,-.15); box(g,1.23,.15,.8,0x293746,0,1.47,-.13); box(g,.38,.18,.08,0xfff2bb,-.48,.79,1.19); box(g,.38,.18,.08,0xfff2bb,.48,.79,1.19); for(const z of [-.7,.7]){ for(const x of [-.77,.77]){ const w=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.16,12),darkMat); w.rotation.z=Math.PI/2;w.position.set(x,.32,z);g.add(w); } } g.position.set([-4,-2,0,2,4][Math.floor(Math.random()*5)],0,-150); scene.add(g);traffic.push(g); } function clearTraffic(){ for(const c of traffic)scene.remove(c); traffic=[]; } function startGame(){ initAudio(); if(audio.state==='suspended')audio.resume(); scene.remove(player); selectedBike=Number($('bike').value); player=makeBike(selectedBike); clearTraffic(); speed=0;score=0;level=1;gameOver=false;running=true; $('menu').style.display='none'; for(let i=0;i<8;i++)makeCar(); } function endGame(){ running=false;gameOver=true;gasOn=false; beep(100,.5); $('menu').style.display='flex'; $('start').textContent='↻ RESTART GAME'; $('hint').textContent='CRASH! Score: '+score+' — Press restart to ride again.'; } $('start').addEventListener('click',startGame); $('sound').addEventListener('click',()=>{ soundOn=!soundOn; $('sound').textContent=soundOn?'🔊 SOUND ON':'🔇 SOUND OFF'; if(!soundOn&&engineGain)engineGain.gain.value=0; else if(soundOn)initAudio(); }); $('horn').addEventListener('pointerdown',e=>{e.preventDefault();beep(240,.35);}); function hold(id,onDown,onUp){ const el=$(id); el.addEventListener('pointerdown',e=>{ e.preventDefault();el.setPointerCapture?.(e.pointerId);onDown(); }); const stop=e=>{e.preventDefault();onUp();}; el.addEventListener('pointerup',stop); el.addEventListener('pointercancel',stop); el.addEventListener('lostpointercapture',onUp); } hold('gas',()=>gasOn=true,()=>gasOn=false); hold('brake',()=>brakeOn=true,()=>brakeOn=false); hold('left',()=>leftOn=true,()=>leftOn=false); hold('right',()=>rightOn=true,()=>rightOn=false); addEventListener('keydown',e=>{ if(e.key==='ArrowUp'||e.key==='w')gasOn=true; if(e.key==='ArrowDown'||e.key==='s')brakeOn=true; if(e.key==='ArrowLeft'||e.key==='a')leftOn=true; if(e.key==='ArrowRight'||e.key==='d')rightOn=true; if(e.key===' ')beep(240,.35); }); addEventListener('keyup',e=>{ if(e.key==='ArrowUp'||e.key==='w')gasOn=false; if(e.key==='ArrowDown'||e.key==='s')brakeOn=false; if(e.key==='ArrowLeft'||e.key==='a')leftOn=false; if(e.key==='ArrowRight'||e.key==='d')rightOn=false; }); let spawnTimer=0; const clock=new THREE.Clock(); function animate(){ requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),.04); if(running&&player){ if(gasOn)speed=Math.min(200,speed+48*dt); else speed=Math.max(0,speed-22*dt); if(brakeOn)speed=Math.max(0,speed-85*dt); const move=5.3*dt*(.4+speed/75); if(leftOn)player.position.x-=move; if(rightOn)player.position.x+=move; player.position.x=THREE.MathUtils.clamp(player.position.x,-4.8,4.8); player.rotation.z=leftOn?.12:rightOn?-.12:0; player.rotation.z*= -1; const worldMove=(speed/3.6)*dt*1.4; laneMarks.forEach(m=>{ m.position.z+=worldMove; if(m.position.z>12)m.position.z-=224; }); scenery.forEach(o=>{ o.position.z+=worldMove; if(o.position.z>18)o.position.z-=235; }); spawnTimer+=dt; if(spawnTimer>1.25){ spawnTimer=0; if(traffic.length<13)makeCar(); } for(let i=traffic.length-1;i>=0;i--){ const c=traffic[i]; c.position.z+=worldMove+10*dt; if(c.position.z>14){ scene.remove(c);traffic.splice(i,1); score+=10; } if(Math.abs(c.position.z-player.position.z)<1.7&& Math.abs(c.position.x-player.position.x)<1.25){ endGame();break; } } score+=Math.floor(speed*dt*.04); level=Math.min(200,1+Math.floor(score/250)); player.position.y=.04+Math.sin(performance.now()*.015)*.025; camera.position.x+=(player.position.x*.3-camera.position.x)*dt*2; camera.lookAt(player.position.x*.25,1,-2); updateSound(); $('speed').textContent=Math.round(speed); $('score').textContent=score; $('level').textContent=level; } renderer.render(scene,camera); } animate(); addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); }); </script> </body> </html>
