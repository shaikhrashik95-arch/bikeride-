<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"> <title>Bike Traffic Rush 3D</title> <style> *{box-sizing:border-box} body{margin:0;overflow:hidden;background:#82c9ef;font-family:Arial;touch-action:none} canvas{display:block} #hud{position:fixed;top:7px;left:5px;right:5px;display:flex;justify-content:space-between;gap:4px;pointer-events:none} .stat{background:#101cdd;color:white;border-radius:8px;padding:8px 5px;text-align:center;font-size:12px;font-weight:bold} #top{position:fixed;right:6px;top:54px;display:flex;gap:4px} button,select{border:0;border-radius:9px;padding:10px;background:#17212b;color:white;font-weight:bold} #controls{position:fixed;bottom:12px;left:5px;right:5px;display:flex;justify-content:space-between;gap:3px} .pad{display:flex;gap:4px;align-items:center} .ctrl{height:56px;min-width:43px;padding:4px;font-size:11px;touch-action:none;border:2px solid #ffffff55} #left,#right{border-radius:50%;font-size:21px} #gas{background:#078347} #brake{background:#c62828} #horn{background:#946600} #hint{position:fixed;bottom:74px;width:100%;text-align:center;color:white;font-size:11px;text-shadow:0 2px 4px #000;pointer-events:none} #menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#061321cc;padding:12px;color:white} .panel{width:min(390px,100%);max-height:90vh;overflow:auto;background:#101b26f5;border-radius:18px;padding:18px;text-align:center} h1{font-size:23px;color:#ffd54a} p{font-size:13px;line-height:1.5} select{width:100%;margin:8px 0} #start{width:100%;background:#079d51;font-size:19px;margin-top:8px} @media(max-width:360px){.ctrl{min-width:36px;font-size:10px;padding:3px}.pad{gap:2px}} </style> </head> <body> <div id="hud"> <div class="stat">SPEED<br><span id="speed">0</span> km/h</div> <div class="stat">LEVEL<br><span id="level">1</span>/200</div> <div class="stat">DISTANCE<br><span id="distance">0</span> m</div> </div> <div id="top"> <button id="sound">🔊 SOUND ON</button> <button id="pause">PAUSE</button> </div> <div id="hint">STEER ◀ ▶ • ACCELERATE • BRAKE</div> <div id="controls"> <div class="pad"> <button class="ctrl" id="left">◀</button> <button class="ctrl" id="right">▶</button> </div> <div class="pad"> <button class="ctrl" id="horn">HORN</button> <button class="ctrl" id="brake">BRAKE</button> <button class="ctrl" id="gas">GAS</button> </div> </div> <div id="menu"> <div class="panel"> <h1>🏍️ BIKE TRAFFIC RUSH 3D</h1> <p>Choose your bike colour and start riding!</p> <select id="bike"> <option value="0">01 Racing Red</option><option value="1">02 Ocean Blue</option> <option value="2">03 Neon Green</option><option value="3">04 Golden Yellow</option> <option value="4">05 Purple Storm</option><option value="5">06 Orange Flash</option> <option value="6">07 White Phantom</option><option value="7">08 Black Shadow</option> <option value="8">09 Pink Nitro</option><option value="9">10 Cyan Wave</option> <option value="10">11 Silver Bullet</option><option value="11">12 Lime Racer</option> <option value="12">13 Magenta Rush</option><option value="13">14 Bronze Rider</option> <option value="14">15 Ice Blue</option><option value="15">16 Emerald</option> </select> <p>Maximum speed: 200 km/h<br>200 Levels • 3D Traffic • Horn • Engine Sound</p> <div id="message">Ready to ride?</div> <button id="start">START GAME</button> </div> </div> <script type="module"> import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js'; const $=id=>document.getElementById(id); const scene=new THREE.Scene(); scene.background=new THREE.Color(0x82c9ef); scene.fog=new THREE.Fog(0x82c9ef,75,260); const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,600); camera.position.set(0,5.2,10); const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.shadowMap.enabled=true; renderer.outputColorSpace=THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement); scene.add(new THREE.HemisphereLight(0xffffff,0x526044,2)); const sun=new THREE.DirectionalLight(0xffffff,2); sun.position.set(-12,25,10); sun.castShadow=true; scene.add(sun); function material(color,roughness=.65,metalness=0){ return new THREE.MeshStandardMaterial({color,roughness,metalness}); } const cube=new THREE.BoxGeometry(1,1,1); function box(parent,w,h,d,mat,x,y,z){ const o=new THREE.Mesh(cube,mat); o.scale.set(w,h,d); o.position.set(x,y,z); o.castShadow=true; o.receiveShadow=true; parent.add(o); return o; } function cyl(parent,r,h,mat,x,y,z,rx=0,rz=0){ const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),mat); o.position.set(x,y,z); o.rotation.set(rx,0,rz); o.castShadow=true; parent.add(o); return o; } /* ROAD */ const grass=material(0x438b3b); const asphalt=material(0x30343a); const white=material(0xffffff); const rail=material(0x9ca8b0,.4,.5); box(scene,400,.3,700,grass,0,-.35,-140); const road=new THREE.Group(); scene.add(road); box(road,13,.16,350,asphalt,0,-.12,-140); box(road,.18,.04,350,white,-6.3,-.01,-140); box(road,.18,.04,350,white,6.3,-.01,-140); const dashes=[]; for(let z=20;z>-340;z-=8){ for(const x of [-2.1,2.1]){ dashes.push(box(road,.12,.035,3.5,white,x,-.01,z)); } } for(const x of [-7,7]){ box(road,.18,.5,350,rail,x,.1,-140); for(let z=15;z>-330;z-=18){ box(road,.22,.6,.25,rail,x,.05,z); } } /* ROADSIDE SCENERY */ const scenery=[]; const bark=material(0x704522); const leaves=[material(0x28743b),material(0x398c49)]; const buildings=[ material(0xc6b7a0),material(0x8fa6b5), material(0xd1c5b5),material(0xb3b5b8) ]; const glass=material(0x92d9f2,.25,.1); function makeTree(x,z){ const g=new THREE.Group(); g.position.set(x,0,z); cyl(g,.15,1.5,bark,0,.75,0); const a=new THREE.Mesh(new THREE.ConeGeometry(.95,2.2,9),leaves[0]); a.position.y=2.1; a.castShadow=true; g.add(a); const b=new THREE.Mesh(new THREE.ConeGeometry(.65,1.5,9),leaves[1]); b.position.y=2.8; g.add(b); scene.add(g); scenery.push(g); } function makeBuilding(x,z){ const g=new THREE.Group(); const w=3+Math.random()*3,h=4+Math.random()*9,d=3; g.position.set(x,h/2,z); box(g,w,h,d,buildings[Math.floor(Math.random()*buildings.length)],0,0,0); for(let y=-h/2+.8;y<h/2-.3;y+=1.4){ for(let xx=-w/2+.5;xx<w/2-.2;xx+=1.1){ box(g,.42,.6,.04,glass,xx,y,d/2+.03); } } scene.add(g); scenery.push(g); } for(let z=25;z>-340;z-=12){ for(const side of [-1,1]){ const x=side*(10+Math.random()*10); if(Math.random()<.65)makeTree(x,z-Math.random()*6); else makeBuilding(x,z-Math.random()*6); } } /* PLAYER BIKE */ const bikeColors=[ 0xe53935,0x1677ff,0x39d353,0xffd600, 0x8e44ad,0xff7800,0xf4f7fa,0x20252b, 0xff4fa3,0x00cfe8,0xaeb7c1,0xb4ed21, 0xe000a5,0xb87333,0x9cecff,0x008f62 ]; const rubber=material(0x08090a); const chrome=material(0xbec8d0,.3,.7); let player=new THREE.Group(); function makeBike(index){ scene.remove(player); player=new THREE.Group(); const paint=material(bikeColors[index],.28,.35); const black=material(0x15191d); const jacket=material(0x202d42); const helmet=material(0xf2f5f7,.3,.2); for(const z of [-.95,.9]){ const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.18,24),rubber); wheel.rotation.z=Math.PI/2; wheel.position.set(0,.48,z); wheel.castShadow=true; player.add(wheel); const hub=new THREE.Mesh(new THREE.CylinderGeometry(.17,.17,.2,16),chrome); hub.rotation.z=Math.PI/2; hub.position.set(0,.48,z); player.add(hub); } box(player,.52,.42,1.25,paint,0,1.05,0); box(player,.4,.25,.48,black,0,1.37,-.05); const tank=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),paint); tank.scale.set(.85,.72,1.1); tank.position.set(0,1.43,-.18); player.add(tank); box(player,.12,.75,.12,chrome,0,1,.72); box(player,.8,.08,.12,chrome,0,1.48,.95); box(player,.34,.16,.25,material(0xfff3b0),0,1.1,-.68); box(player,.22,.12,.08,material(0xe21e2b),0,1,1); const body=new THREE.Mesh(new THREE.SphereGeometry(.34,12,12),jacket); body.scale.set(.9,1.35,.72); body.position.set(0,1.95,.18); player.add(body); const head=new THREE.Mesh(new THREE.SphereGeometry(.25,16,12),helmet); head.position.set(0,2.38,-.02); player.add(head); for(const s of [-1,1]){ cyl(player,.1,.72,jacket,s*.29,1.88,-.3,Math.PI/2); cyl(player,.12,.65,black,s*.18,1.25,.55,.5); } player.position.set(0,0,3); scene.add(player); } /* TRAFFIC CARS */ const traffic=[]; const carColors=[0xc9252d,0xf5f5f5,0x1765a5,0x22252b,0xc9a21b,0x287b45,0x88949c]; const carGlass=material(0x83c8df,.22,.15); const dark=material(0x17191b); const lamp=material(0xfff2c2); const tailLamp=material(0xff1515); function makeCar(z){ const g=new THREE.Group(); const paint=material(carColors[Math.floor(Math.random()*carColors.length)],.3,.25); box(g,1.65,.55,3.1,paint,0,.68,0); box(g,1.2,.68,1.5,paint,0,1.22,-.22); box(g,1.08,.48,1.32,carGlass,0,1.27,-.2); box(g,.1,.15,.12,lamp,-.57,.77,-1.57); box(g,.1,.15,.12,lamp,.57,.77,-1.57); box(g,.12,.17,.1,tailLamp,-.57,.77,1.57); box(g,.12,.17,.1,tailLamp,.57,.77,1.57); for(const x of [-.82,.82]){ for(const zz of [-1,1]){ const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,.2,16),rubber); wheel.rotation.z=Math.PI/2; wheel.position.set(x,.37,zz); g.add(wheel); const hub=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.21,12),chrome); hub.rotation.z=Math.PI/2; hub.position.set(x,.37,zz); g.add(hub); } } g.position.set([-4,0,4][Math.floor(Math.random()*3)],0,z); scene.add(g); traffic.push({mesh:g,z,speed:0.45+Math.random()*.6}); } for(let i=0;i<10;i++)makeCar(-25-i*25); /* SOUND: SYNTHESIZED WITH WEB AUDIO */ let audio=null,osc=null,gain=null; let soundOn=true,started=false,paused=false,crashed=false; function initAudio(){ if(audio)return; try{ audio=new (window.AudioContext||window.webkitAudioContext)(); osc=audio.createOscillator(); gain=audio.createGain(); osc.type='sawtooth'; gain.gain.value=0; osc.connect(gain); gain.connect(audio.destination); osc.start(); }catch(e){} } function engineSound(){ if(!audio||!osc||!gain)return; const active=started&&!paused&&soundOn&&!crashed; osc.frequency.setTargetAtTime(65+speed*2.1,audio.currentTime,.08); gain.gain.setTargetAtTime(active?Math.min(.035,.006+speed*.00012):0,audio.currentTime,.08); } function beep(freq,duration,volume=.15){ if(!soundOn)return; initAudio(); if(!audio)return; if(audio.state==='suspended')audio.resume(); const o=audio.createOscillator(); const g=audio.createGain(); o.frequency.value=freq; g.gain.setValueAtTime(volume,audio.currentTime); g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration); o.connect(g);g.connect(audio.destination); o.start();o.stop(audio.currentTime+duration); } /* GAME STATE */ let speed=0,distance=0,level=1,steer=0; let gas=false,braking=false; let last=performance.now(); function updateHUD(){ $('speed').textContent=Math.round(speed); $('distance').textContent=Math.floor(distance); $('level').textContent=level; } function resetGame(){ speed=0;distance=0;level=1;steer=0; gas=false;braking=false;crashed=false;paused=false; $('pause').textContent='PAUSE'; for(const c of traffic){ c.z=-25-Math.random()*230; c.mesh.position.z=c.z; c.mesh.position.x=[-4,0,4][Math.floor(Math.random()*3)]; } player.position.x=0; updateHUD(); } function endCrash(){ if(crashed)return; crashed=true;speed=0;gas=false;braking=false; beep(90,.5,.22); $('message').textContent='CRASH! Press RESTART to play again.'; $('title').textContent='💥 CRASH!'; $('start').textContent='RESTART'; $('menu').style.display='flex'; } function animate(now){ requestAnimationFrame(animate); const dt=Math.min((now-last)/1000,.05); last=now; if(started&&!paused&&!crashed){ if(gas)speed+=42*dt; else speed-=7*dt; if(braking)speed-=75*dt; speed=THREE.MathUtils.clamp(speed,0,200); const movement=(speed/3.6)*dt; distance+=movement; level=Math.min(200,1+Math.floor(distance/120)); player.position.x+=steer*7*dt*(.5+speed/100); player.position.x=THREE.MathUtils.clamp(player.position.x,-5.3,5.3); player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,-steer*.16,.12); for(const d of dashes){ d.position.z+=movement; if(d.position.z>12)d.position.z-=350; } for(const s of scenery){ s.position.z+=movement; if(s.position.z>18)s.position.z-=360; } for(const c of traffic){ c.z+=movement*(.85-c.speed*.15); if(c.z>12){ c.z=-220-Math.random()*100; c.mesh.position.x=[-4,0,4][Math.floor(Math.random()*3)]; c.speed=.45+Math.random()*.6; } c.mesh.position.z=c.z; if(Math.abs(c.z-player.position.z)<2.25&& Math.abs(c.mesh.position.x-player.position.x)<1.25){ endCrash(); } } camera.position.x=THREE.MathUtils.lerp(camera.position.x,player.position.x*.38,.06); camera.position.y=5.2; camera.position.z=10; camera.lookAt(player.position.x*.5,1,-7); engineSound(); updateHUD(); } renderer.render(scene,camera); } /* BUTTONS */ function holdButton(id,down,up){ const b=$(id); b.addEventListener('pointerdown',e=>{ e.preventDefault(); b.setPointerCapture?.(e.pointerId); down(); }); for(const ev of ['pointerup','pointercancel','lostpointercapture']){ b.addEventListener(ev,e=>{e.preventDefault();up();}); } } holdButton('gas',()=>gas=true,()=>gas=false); holdButton('brake',()=>braking=true,()=>braking=false); holdButton('left',()=>steer=-1,()=>{if(steer===-1)steer=0;}); holdButton('right',()=>steer=1,()=>{if(steer===1)steer=0;}); $('horn').addEventListener('pointerdown',e=>{ e.preventDefault(); beep(520,.35,.22); }); $('sound').onclick=()=>{ soundOn=!soundOn; $('sound').textContent=soundOn?'🔊 SOUND ON':'🔇 SOUND OFF'; engineSound(); }; $('pause').onclick=()=>{ if(!started||crashed)return; paused=!paused; $('pause').textContent=paused?'RESUME':'PAUSE'; if(!paused)last=performance.now(); }; $('bike').onchange=()=>makeBike(Number($('bike').value)); $('start').onclick=()=>{ initAudio(); if(audio&&audio.state==='suspended')audio.resume(); makeBike(Number($('bike').value)); resetGame(); started=true; $('menu').style.display='none'; $('title').textContent='🏍️ BIKE TRAFFIC RUSH 3D'; $('message').textContent='Ready to ride?'; $('start').textContent='START GAME'; last=performance.now(); }; addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')steer=-1; if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')steer=1; if(e.key==='ArrowUp'||e.key===' ')gas=true; if(e.key==='ArrowDown')braking=true; if(e.key.toLowerCase()==='h')beep(520,.35,.22); }); addEventListener('keyup',e=>{ if(['ArrowLeft','ArrowRight','a','d'].includes(e.key)||['a','d'].includes(e.key.toLowerCase()))steer=0; if(e.key==='ArrowUp'||e.key===' ')gas=false; if(e.key==='ArrowDown')braking=false; }); addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); }); makeBike(0); updateHUD(); requestAnimationFrame(animate); </script> </body> </html>
