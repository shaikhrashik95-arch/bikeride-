<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"> <title>Bike Traffic Rush 3D</title> <style> *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden; font-family:Arial,sans-serif;background:#071019;color:white;touch-action:none} canvas{position:absolute;inset:0;width:100%;height:100%} #hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none} .stat{background:#101b28dd;border:1px solid #52677a;border-radius:10px;padding:8px;font-size:13px;line-height:1.7} #overlay{position:absolute;inset:0;background:#06101be8;display:flex;align-items:center;justify-content:center;padding:18px} #panel{width:100%;max-width:430px;text-align:center;padding:22px 16px;border:2px solid #27c8f5;border-radius:20px;background:linear-gradient(145deg,#1b354e,#08111b)} h1{color:#56dfff;font-size:clamp(27px,7vw,36px);margin:0 0 14px} p{line-height:1.6;color:#e0edf7;font-size:14px} button{touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent;font-weight:bold} #start{width:100%;padding:17px;border:0;border-radius:13px;background:#ffcf32;color:#111;font-size:20px;margin-top:12px} #controls{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 12px} .group{display:flex;gap:8px} .ctrl{width:clamp(55px,17vw,76px);height:clamp(60px,17vw,80px);border:3px solid #9aa6b3;border-radius:16px;background:#122235;color:white;font-size:25px} .gas{background:#08763f;border-color:#91e4b0;font-size:13px} .brake{background:#922727;border-color:#efaaaa;font-size:12px} #hint{position:absolute;bottom:100px;width:100%;text-align:center;font-size:12px;color:#eee;pointer-events:none} .hide{display:none!important} </style> </head> <body> <canvas id="game"></canvas> <div id="hud"> <div class="stat">LEVEL <b id="lv">1</b>/16<br>DISTANCE <b id="dist">0</b> m</div> <div class="stat" style="text-align:right">SCORE <b id="score">0</b><br>SPEED <b id="speed">0</b> km/h</div> </div> <div id="overlay"> <div id="panel"> <h1 id="heading">BIKE TRAFFIC RUSH 3D</h1> <p id="message">Ride through traffic! Avoid buses, trucks, lorries and bikes. Complete all 16 levels.</p> <p>⬅ LEFT &nbsp; RIGHT ➜<br>🟢 GAS &nbsp; 🔴 BRAKE</p> <button id="start" type="button">START RIDE</button> <p>Android mobile browser game · 3D-style graphics</p> </div> </div> <div id="hint">Hold GAS to accelerate · Avoid traffic</div> <div id="controls"> <div class="group"> <button class="ctrl" id="left">◀</button> <button class="ctrl" id="right">▶</button> </div> <div class="group"> <button class="ctrl brake" id="brake">BRAKE</button> <button class="ctrl gas" id="gas">GAS ▲</button> </div> </div> <script> "use strict"; /* Canvas */ var canvas=document.getElementById("game"); var ctx=canvas.getContext("2d"); var W=innerWidth,H=innerHeight,dpr=1; function resize(){ W=innerWidth;H=innerHeight; dpr=Math.min(window.devicePixelRatio||1,2); canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr); canvas.style.width=W+"px"; canvas.style.height=H+"px"; ctx.setTransform(dpr,0,0,dpr,0,0); } window.addEventListener("resize",resize); resize(); /* State */ var running=false,level=1,score=0,distance=0; var speed=0,playerX=0,roadMove=0,levelDistance=0; var traffic=[],spawn=0,last=0; var keys={left:false,right:false,gas:false,brake:false}; var colours=["#ef3e46","#2b8bd4","#f0bd31","#39a76a","#e6e8ef"]; function el(id){return document.getElementById(id)} function startGame(){ level=1;score=0;distance=0;speed=0; playerX=0;roadMove=0;levelDistance=0; traffic=[];spawn=0; for(var k in keys)keys[k]=false; running=true; el("overlay").classList.add("hide"); el("heading").textContent="BIKE TRAFFIC RUSH 3D"; el("message").textContent="Ride through traffic! Complete all 16 levels."; hud(); } el("start").addEventListener("click",startGame); el("start").addEventListener("touchend",function(e){ e.preventDefault(); startGame(); },{passive:false}); /* Touch controls */ function bind(id,key){ var b=el(id); function down(e){ e.preventDefault();keys[key]=true; try{b.setPointerCapture(e.pointerId)}catch(x){} } function up(e){e.preventDefault();keys[key]=false} b.addEventListener("pointerdown",down); b.addEventListener("pointerup",up); b.addEventListener("pointercancel",up); b.addEventListener("lostpointercapture",function(){keys[key]=false}); } bind("left","left");bind("right","right"); bind("gas","gas");bind("brake","brake"); window.addEventListener("keydown",function(e){ var k=e.key.toLowerCase(); if(k==="arrowleft"||k==="a")keys.left=true; if(k==="arrowright"||k==="d")keys.right=true; if(k==="arrowup"||k==="w")keys.gas=true; if(k==="arrowdown"||k==="s")keys.brake=true; }); window.addEventListener("keyup",function(e){ var k=e.key.toLowerCase(); if(k==="arrowleft"||k==="a")keys.left=false; if(k==="arrowright"||k==="d")keys.right=false; if(k==="arrowup"||k==="w")keys.gas=false; if(k==="arrowdown"||k==="s")keys.brake=false; }); window.addEventListener("blur",function(){ for(var k in keys)keys[k]=false; }); /* Drawing */ function poly(points,color){ ctx.fillStyle=color;ctx.beginPath(); points.forEach(function(p,i){ if(i===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]); }); ctx.closePath();ctx.fill(); } function box(x,y,w,h,color){ ctx.fillStyle=color;ctx.fillRect(x,y,w,h); } function rr(x,y,w,h,r,color){ ctx.fillStyle=color;ctx.beginPath(); ctx.roundRect(x,y,w,h,r);ctx.fill(); } function roadAt(y){ var t=Math.max(0,Math.min(1,(y-H*.29)/(H*.71))); return {t:t,half:W*(.08+.44*t)}; } function laneX(lane,t){return W/2+lane*W*(.14+.30*t)} function tree(x,y,s){ box(x-s*.08,y-s*.7,s*.16,s*.7,"#68452d"); ctx.fillStyle="#16502b";ctx.beginPath(); ctx.arc(x,y-s,s*.52,0,Math.PI*2);ctx.fill(); ctx.fillStyle="#2b7b3d";ctx.beginPath(); ctx.arc(x-s*.14,y-s*1.17,s*.32,0,Math.PI*2);ctx.fill(); } function world(){ var sky=ctx.createLinearGradient(0,0,0,H*.5); sky.addColorStop(0,"#39a7df");sky.addColorStop(1,"#d7f0ff"); box(0,0,W,H,"#347649"); ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.5); poly([[0,H*.40],[W*.18,H*.26],[W*.35,H*.37], [W*.53,H*.24],[W*.74,H*.37],[W*.89,H*.27], [W,H*.37],[W,H*.51],[0,H*.51]],"#648772"); var top=H*.29; poly([[W*.42,top],[W*.58,top],[W*1.07,H],[W*-.07,H]],"#383d45"); poly([[W*.414,top],[W*.42,top],[W*-.07,H],[W*-.13,H]],"#eee9dc"); poly([[W*.58,top],[W*.586,top],[W*1.13,H],[W*1.07,H]],"#eee9dc"); for(var i=0;i<18;i++){ var t=((i/18+roadMove*.0015)%1); var y=top+t*(H-top),r=roadAt(y); var d=3+t*34,w=1+t*3; box(W/2-r.half/3-w/2,y,w,d,"#f4f0db"); box(W/2+r.half/3-w/2,y,w,d,"#f4f0db"); } for(var j=0;j<8;j++){ var q=((j/8+roadMove*.0007)%1); var yy=top+q*(H-top),r2=roadAt(yy),s=5+q*19; tree(W/2-r2.half-W*.045-s,yy,s); tree(W/2+r2.half+W*.045+s,yy,s*.8); } } function bike(x,y,s,color){ ctx.fillStyle="#0007";ctx.beginPath(); ctx.ellipse(x,y,13*s,5*s,0,0,Math.PI*2);ctx.fill(); ctx.fillStyle="#101419";ctx.beginPath(); ctx.ellipse(x,y-8*s,5.5*s,15*s,0,0,Math.PI*2);ctx.fill(); ctx.strokeStyle="#aab9c5";ctx.lineWidth=1.5*s;ctx.stroke(); ctx.strokeStyle=color;ctx.lineWidth=5*s;ctx.beginPath(); ctx.moveTo(x,y-9*s);ctx.lineTo(x-6*s,y-24*s); ctx.lineTo(x+6*s,y-24*s);ctx.lineTo(x,y-9*s);ctx.stroke(); ctx.strokeStyle="#161b20";ctx.lineWidth=2*s;ctx.beginPath(); ctx.moveTo(x-10*s,y-28*s);ctx.lineTo(x+10*s,y-28*s);ctx.stroke(); ctx.fillStyle="#f0a02c";ctx.fillRect(x-3*s,y-36*s,6*s,13*s); ctx.fillStyle="#f1f5f8";ctx.beginPath(); ctx.arc(x,y-41*s,6.5*s,0,Math.PI*2);ctx.fill(); ctx.fillStyle="#26384a";ctx.fillRect(x-5*s,y-43*s,10*s,3*s); } function vehicle(v){ var y=H*.29+v.z*H*.71; var x=laneX(v.lane,v.z),s=.30+v.z*1.25; if(v.type==="bike"){bike(x,y,Math.max(.4,s*.65),v.color);return} var w=W*(v.type==="bus"?.12:.095)*s; var h=H*(v.type==="bus"?.18:.145)*s; ctx.fillStyle="#0006";ctx.beginPath(); ctx.ellipse(x,y,w*.65,h*.12,0,0,Math.PI*2);ctx.fill(); rr(x-w/2,y-h,w,h,Math.max(2,w*.07),v.color); rr(x-w*.37,y-h*.88,w*.74,h*.23,3,"#9bd7e8"); if(v.type==="bus"){ for(var i=0;i<4;i++)rr(x-w*.42+i*w*.22,y-h*.58,w*.18,h*.17,2,"#bceaf4"); }else{ rr(x-w*.35,y-h*.58,w*.7,h*.18,2,"#91c8df"); if(v.type==="truck"||v.type==="lorry") rr(x-w*.45,y-h*.34,w*.9,h*.29,2,"#d5dce2"); } rr(x-w*.43,y-h*.13,w*.18,h*.06,2,"#ff4141"); rr(x+w*.25,y-h*.13,w*.18,h*.06,2,"#ff4141"); rr(x-w*.55,y-h*.28,w*.14,h*.23,2,"#151719"); rr(x+w*.41,y-h*.28,w*.14,h*.23,2,"#151719"); } function player(){ bike(W/2+playerX*W*.30,H*.84,Math.min(1.15,W/390),"#ed293f"); } /* HUD and end state */ function hud(){ el("lv").textContent=level; el("dist").textContent=Math.floor(distance); el("score").textContent=score; el("speed").textContent=Math.floor(speed); } function endGame(won){ running=false; for(var k in keys)keys[k]=false; el("heading").textContent=won?"🏆 YOU WIN!":"💥 GAME OVER"; el("message").textContent=won? "You completed all 16 levels! Score: "+score: "Crash! Level "+level+"/16 · Score: "+score; el("start").textContent="PLAY AGAIN"; el("overlay").classList.remove("hide"); } /* Update */ function update(dt){ if(!running)return; var maxSpeed=115+level*6; speed=Math.max(0,Math.min(maxSpeed, speed+((keys.gas?125:0)-(keys.brake?190:0)-12)*dt)); if(keys.left)playerX-=dt*1.7; if(keys.right)playerX+=dt*1.7; playerX=Math.max(-1.05,Math.min(1.05,playerX)); distance+=speed*dt*.38; levelDistance+=speed*dt*.38; roadMove+=speed*dt; spawn-=dt; if(spawn<=0){ var lane=Math.floor(Math.random()*3)-1; var occupied=traffic.some(function(v){return v.lane===lane&&v.z<.30}); if(!occupied){ var r=Math.random(); var type=r<.24?"bus":r<.48?"truck":r<.72?"lorry":"bike"; traffic.push({lane:lane,z:.01,type:type, color:colours[Math.floor(Math.random()*colours.length)]}); } spawn=Math.max(.45,1.05-level*.025); } var px=W/2+playerX*W*.30; for(var i=traffic.length-1;i>=0;i--){ var v=traffic[i]; v.z+=(.20+speed/maxSpeed*.22+level*.005)*dt; if(v.z>.72){ var ox=laneX(v.lane,v.z); var collisionWidth=W*(v.type==="bike"?.045:.075); if(Math.abs(ox-px)<collisionWidth){ endGame(false);return; } score+=50; traffic.splice(i,1); }else if(v.z>1.2){ traffic.splice(i,1); } } if(levelDistance>=400+level*100){ levelDistance=0;score+=500; if(level===16){endGame(true);return} level++; traffic=traffic.filter(function(v){return v.z<.25}); } hud(); } function frame(now){ var dt=Math.min((now-last)/1000||0,.04); last=now; update(dt); world(); traffic.sort(function(a,b){return a.z-b.z}); traffic.forEach(vehicle); player(); requestAnimationFrame(frame); } hud(); requestAnimationFrame(frame); </script> </body> </html>
