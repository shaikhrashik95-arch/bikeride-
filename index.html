<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"> <title>Bike Traffic Rush 3D</title> <style> *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden; background:#07111b;color:white;font-family:Arial,sans-serif; touch-action:none} canvas{position:absolute;inset:0;width:100%;height:100%} #hud{position:absolute;top:8px;left:8px;right:8px; display:flex;justify-content:space-between;pointer-events:none} .info{background:#101c2bdd;border:1px solid #ffffff55; border-radius:10px;padding:8px;font-size:13px;line-height:1.7} .gold{color:#ffe36b;font-weight:bold} #overlay{position:absolute;inset:0;display:flex;align-items:center; justify-content:center;padding:18px;background:#06101acc} #panel{width:100%;max-width:430px;text-align:center;padding:22px 16px; border:1px solid #36d5ff;border-radius:20px; background:linear-gradient(145deg,#1a3048,#080e17); box-shadow:0 0 25px #00bfff22} h1{color:#59ddff;font-size:clamp(25px,7vw,36px);margin:0 0 14px} p{color:#d9e8f5;line-height:1.6;font-size:14px} #start{width:100%;padding:16px;margin-top:10px;border:0; border-radius:12px;background:#ffcf32;color:#111;font-weight:bold; font-size:19px;touch-action:manipulation} #start:active{background:#ffe680;transform:scale(.98)} #controls{position:absolute;left:0;right:0;bottom:15px; display:flex;align-items:end;justify-content:space-between;padding:0 12px} .group{display:flex;gap:8px} .ctrl{width:clamp(54px,17vw,72px);height:clamp(60px,17vw,76px); border-radius:14px;border:2px solid #ffffff88;background:#132337ee; color:white;font-size:25px;font-weight:bold;touch-action:none; user-select:none;-webkit-user-select:none} .ctrl:active{filter:brightness(1.5)} .gas{background:#087640;border-color:#8bdfae;font-size:14px} .brake{background:#912323;border-color:#eaa1a1;font-size:13px} #hint{position:absolute;bottom:100px;left:0;right:0;text-align:center; font-size:12px;color:#ffffffbb;pointer-events:none} .hidden{display:none!important} </style> </head> <body> <canvas id="game"></canvas> <div id="hud"> <div class="info">LEVEL <span id="level" class="gold">1</span>/16<br> DISTANCE <span id="distance">0</span> m</div> <div class="info" style="text-align:right">SCORE <span id="score" class="gold">0</span><br> SPEED <span id="speed">0</span> km/h</div> </div> <div id="overlay"> <div id="panel"> <h1 id="title">BIKE TRAFFIC RUSH 3D</h1> <p id="message">Race through traffic! Avoid buses, trucks, lorries and other bikes. Complete all 16 levels!</p> <p>⬅ LEFT &nbsp; RIGHT ➜<br>🟢 GAS &nbsp;&nbsp; 🔴 BRAKE</p> <button id="start" type="button">START RIDE</button> <p style="font-size:11px">Android browser game · Perspective 3D-style graphics</p> </div> </div> <div id="hint">Hold GAS to accelerate · Avoid traffic</div> <div id="controls"> <div class="group"> <button class="ctrl" id="left" type="button">◀</button> <button class="ctrl" id="right" type="button">▶</button> </div> <div class="group"> <button class="ctrl brake" id="brake" type="button">BRAKE</button> <button class="ctrl gas" id="gas" type="button">GAS ▲</button> </div> </div> <script> (function(){ "use strict"; var canvas=document.getElementById("game"); var ctx=canvas.getContext("2d"); function el(id){return document.getElementById(id)} var W=innerWidth,H=innerHeight,dpr=1; var running=false,level=1,score=0,distance=0,speed=0; var player=0,traffic=[],spawn=0,roadMove=0,last=0,levelDistance=0; var input={left:false,right:false,gas:false,brake:false}; var colors=["#e74c3c","#3189d5","#e6bd32","#42a66a","#e8e9ee"]; var maxLevel=16; function resize(){ W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2); canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); } window.addEventListener("resize",resize);resize(); function rounded(x,y,w,h,r,color){ ctx.fillStyle=color; r=Math.min(r,w/2,h/2); ctx.beginPath();ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.fill(); } function polygon(points,color){ ctx.fillStyle=color;ctx.beginPath(); for(var i=0;i<points.length;i++){ if(i===0)ctx.moveTo(points[i][0],points[i][1]); else ctx.lineTo(points[i][0],points[i][1]); } ctx.closePath();ctx.fill(); } function road(y){ var t=Math.max(0,Math.min(1,(y-H*.30)/(H*.70))); return {t:t,half:W*(.07+.46*t)}; } function laneX(lane,t){return W/2+lane*W*(.14+.31*t)} function drawBackground(){ var g=ctx.createLinearGradient(0,0,0,H*.5); g.addColorStop(0,"#51bce9");g.addColorStop(1,"#e4f4ff"); ctx.fillStyle=g;ctx.fillRect(0,0,W,H*.5); polygon([[0,H*.39],[W*.16,H*.26],[W*.32,H*.37], [W*.48,H*.25],[W*.68,H*.38],[W*.84,H*.28], [W,H*.36],[W,H*.52],[0,H*.52]],"#598768"); ctx.fillStyle="#347447";ctx.fillRect(0,H*.43,W,H*.57); var hz=H*.30; polygon([[W/2-W*.07,hz],[W/2+W*.07,hz],[W*1.05,H],[W*-.05,H]],"#383d44"); polygon([[W/2-W*.075,hz],[W/2-W*.07,hz],[W*-.05,H],[W*-.12,H]],"#e9e6d9"); polygon([[W/2+W*.07,hz],[W/2+W*.075,hz],[W*1.12,H],[W*1.05,H]],"#e9e6d9"); for(var i=0;i<18;i++){ var t=((i/18+roadMove*.0015)%1),y=hz+t*(H-hz),r=road(y); ctx.fillStyle="#f7f5df"; ctx.fillRect(W/2-r.half/3-1,y,Math.max(1,t*3),5+t*32); ctx.fillRect(W/2+r.half/3-1,y,Math.max(1,t*3),5+t*32); } // Roadside trees for(var j=0;j<9;j++){ var q=((j/9+roadMove*.0008)%1),yy=hz+q*(H-hz),rr=road(yy); var sz=5+q*22; tree(W/2-rr.half-W*.04-sz,yy,sz); tree(W/2+rr.half+W*.04+sz,yy,sz*.8); } } function tree(x,y,s){ ctx.fillStyle="#62452d";ctx.fillRect(x-s*.1,y-s*.8,s*.2,s*.8); ctx.fillStyle="#17512c";ctx.beginPath();ctx.arc(x,y-s,s*.55,0,Math.PI*2);ctx.fill(); ctx.fillStyle="#2b7b3d";ctx.beginPath();ctx.arc(x-s*.18,y-s*1.13,s*.34,0,Math.PI*2);ctx.fill(); } function drawBike(x,y,s,color){ ctx.fillStyle="#0007";ctx.beginPath();ctx.ellipse(x,y,12*s,5*s,0,0,Math.PI*2);ctx.fill(); ctx.fillStyle="#111";ctx.beginPath();ctx.ellipse(x,y-8*s,5*s,15*s,0,0,Math.PI*2);ctx.fill(); ctx.strokeStyle=color;ctx.lineWidth=5*s;ctx.beginPath(); ctx.moveTo(x,y-9*s);ctx.lineTo(x-5*s,y-25*s);ctx.lineTo(x+5*s,y-25*s);ctx.lineTo(x,y-9*s);ctx.stroke(); ctx.strokeStyle="#161b20";ctx.lineWidth=2*s;ctx.beginPath(); ctx.moveTo(x-10*s,y-28*s);ctx.lineTo(x+10*s,y-28*s);ctx.stroke(); ctx.fillStyle="#f0a22c";ctx.fillRect(x-3*s,y-35*s,6*s,12*s); ctx.fillStyle="#f4f4f4";ctx.beginPath();ctx.arc(x,y-40*s,6*s,0,Math.PI*2);ctx.fill(); } function drawVehicle(v){ var y=H*.30+v.z*H*.70,t=v.z,x=laneX(v.lane,t); var s=.3+t*1.25,w,h; if(v.type==="bike"){drawBike(x,y,Math.max(.4,s*.65),v.color);return} w=W*(v.type==="bus"?.12:.095)*s; h=H*(v.type==="bus"?.18:.145)*s; ctx.fillStyle="#0006";ctx.beginPath();ctx.ellipse(x,y,w*.65,h*.12,0,0,Math.PI*2);ctx.fill(); rounded(x-w*.5,y-h,w,h,Math.max(2,w*.07),v.color); rounded(x-w*.37,y-h*.88,w*.74,h*.23,3,"#9dd5e8"); if(v.type==="bus"){ for(var i=0;i<4;i++)rounded(x-w*.42+i*w*.22,y-h*.58,w*.18,h*.17,2,"#b7e9f4"); }else{ rounded(x-w*.35,y-h*.58,w*.7,h*.18,2,"#91c8df"); if(v.type==="truck"||v.type==="lorry") rounded(x-w*.45,y-h*.34,w*.9,h*.29,2,"#d7dce1"); } rounded(x-w*.43,y-h*.13,w*.18,h*.06,2,"#ff4040"); rounded(x+w*.25,y-h*.13,w*.18,h*.06,2,"#ff4040"); rounded(x-w*.55,y-h*.28,w*.14,h*.23,2,"#151719"); rounded(x+w*.41,y-h*.28,w*.14,h*.23,2,"#151719"); } function drawPlayer(){ drawBike(W/2+player*W*.30,H*.84,Math.min(1.15,W/390),"#ec263c"); } function updateHUD(){ el("level").textContent=level; el("score").textContent=score; el("distance").textContent=Math.floor(distance); el("speed").textContent=Math.floor(speed); } function startGame(){ level=1;score=0;distance=0;speed=0;player=0; traffic=[];spawn=0;roadMove=0;levelDistance=0; for(var k in input)input[k]=false; running=true;el("overlay").classList.add("hidden"); updateHUD(); } function gameOver(win){ running=false; for(var k in input)input[k]=false; el("title").textContent=win?"🏆 YOU WIN!":"💥 GAME OVER"; el("message").textContent=win? "Congratulations! You completed all 16 levels. Score: "+score: "You crashed into traffic. Level: "+level+"/16. Score: "+score; el("start").textContent="PLAY AGAIN"; el("overlay").classList.remove("hidden"); } el("start").addEventListener("click",function(e){ e.preventDefault();startGame(); }); function hold(id,key){ var b=el(id); function down(e){e.preventDefault();input[key]=true; try{b.setPointerCapture(e.pointerId)}catch(err){}} function up(e){e.preventDefault();input[key]=false} b.addEventListener("pointerdown",down); b.addEventListener("pointerup",up); b.addEventListener("pointercancel",up); b.addEventListener("lostpointercapture",function(){input[key]=false}); } hold("left","left");hold("right","right"); hold("gas","gas");hold("brake","brake"); window.addEventListener("keydown",function(e){ var k=e.key.toLowerCase(); if(k==="arrowleft"||k==="a")input.left=true; if(k==="arrowright"||k==="d")input.right=true; if(k==="arrowup"||k==="w")input.gas=true; if(k==="arrowdown"||k==="s")input.brake=true; }); window.addEventListener("keyup",function(e){ var k=e.key.toLowerCase(); if(k==="arrowleft"||k==="a")input.left=false; if(k==="arrowright"||k==="d")input.right=false; if(k==="arrowup"||k==="w")input.gas=false; if(k==="arrowdown"||k==="s")input.brake=false; }); window.addEventListener("blur",function(){ for(var k in input)input[k]=false; }); function update(dt){ if(!running)return; var max=115+level*6; speed=Math.max(0,Math.min(max,speed+ (input.gas?120:0)-(input.brake?190:0)-12)*dt); var motion=.20+speed/max*.22+level*.005; if(input.left)player-=dt*1.7; if(input.right)player+=dt*1.7; player=Math.max(-1.05,Math.min(1.05,player)); distance+=speed*dt*.38;levelDistance+=speed*dt*.38; roadMove+=speed*dt; spawn-=dt; if(spawn<=0){ var lane=Math.floor(Math.random()*3)-1; if(!traffic.some(function(v){return v.lane===lane&&v.z<.35})){ var r=Math.random(),type=r<.24?"bus":r<.47?"truck":r<.69?"lorry": "bike"; traffic.push({lane:lane,z:.01,type:type, color:colors[Math.floor(Math.random()*colors.length)], passed:false}); } spawn=Math.max(.45,1.05-level*.025); } for(var i=traffic.length-1;i>=0;i--){ var v=traffic[i];v.z+=motion*dt; if(v.z>.82&&!v.passed){ v.passed=true; if(Math.abs(laneX(v.lane,v.z)-(W/2+player*W*.30))<W*.075){ gameOver(false);return; } score+=50; } if(v.z>1.2)traffic.splice(i,1); } if(levelDistance>=400+level*100){ levelDistance=0;score+=500; if(level>=maxLevel){gameOver(true);return} level++;traffic=traffic.filter(function(v){return v.z<.25}); } updateHUD(); } function frame(now){ var dt=Math.min((now-last)/1000||0,.04);last=now; update(dt); drawBackground(); traffic.sort(function(a,b){return a.z-b.z}).forEach(drawVehicle); drawPlayer(); requestAnimationFrame(frame); } updateHUD(); requestAnimationFrame(frame); })(); </script> </body> </html>
