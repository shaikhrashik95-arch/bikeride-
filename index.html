<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"> <title>Bike Traffic Rush 3D</title> <style> *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden; background:#101820;color:white;font-family:Arial,sans-serif;touch-action:none} canvas{position:absolute;inset:0;width:100%;height:100%} #hud{position:absolute;top:8px;left:8px;right:8px; display:flex;justify-content:space-between;pointer-events:none} .box{padding:8px;background:#101820dd;border:1px solid #ffffff55; border-radius:9px;font-size:13px;line-height:1.6} .gold{color:#ffdc50;font-weight:bold} #overlay{position:absolute;inset:0;display:flex;align-items:center; justify-content:center;background:#06101bdf;padding:18px} #panel{width:100%;max-width:420px;padding:22px 16px;text-align:center; border:1px solid #41d9ff;border-radius:18px; background:linear-gradient(145deg,#1b334b,#09111b)} h1{font-size:clamp(26px,7vw,35px);color:#5ce1ff;margin:0 0 14px} p{font-size:14px;line-height:1.6;color:#e0edf7} button{font-weight:bold;border-radius:12px;touch-action:manipulation; -webkit-tap-highlight-color:transparent;user-select:none} #start{width:100%;padding:16px;border:0;background:#ffcf32; color:#101010;font-size:19px;margin-top:10px} #start:active{background:#ffe78c} #controls{position:absolute;bottom:14px;left:0;right:0; display:flex;justify-content:space-between;align-items:end;padding:0 12px} .group{display:flex;gap:8px} .ctrl{width:clamp(55px,17vw,72px);height:clamp(60px,17vw,76px); border:2px solid #ffffff88;background:#15263aee;color:white;font-size:25px} .gas{background:#087840;border-color:#8fe0ad;font-size:13px} .brake{background:#982b2b;border-color:#efaaaa;font-size:12px} #hint{position:absolute;bottom:98px;left:0;right:0;text-align:center; font-size:12px;color:#ffffffcc;pointer-events:none} .hide{display:none!important} </style> </head> <body> <canvas id="game"></canvas> <div id="hud"> <div class="box">LEVEL <span id="lv" class="gold">1</span>/16<br> DISTANCE <span id="dist">0</span> m</div> <div class="box" style="text-align:right">SCORE <span id="pts" class="gold">0</span><br> SPEED <span id="spd">0</span> km/h</div> </div> <div id="overlay"> <div id="panel"> <h1 id="title">BIKE TRAFFIC RUSH 3D</h1> <p id="message">Race through traffic! Avoid buses, trucks, lorries and other bikes. Complete all 16 levels!</p> <p>⬅ LEFT &nbsp; RIGHT ➜<br>🟢 GAS &nbsp; 🔴 BRAKE</p> <button id="start" type="button" onclick="startGame()">START RIDE</button> <p style="font-size:11px">Android Mobile · 3D-style browser game</p> </div> </div> <div id="hint">Hold GAS to accelerate · Avoid traffic</div> <div id="controls"> <div class="group"> <button class="ctrl" id="left" type="button">◀</button> <button class="ctrl" id="right" type="button">▶</button> </div> <div class="group"> <button class="ctrl brake" id="brake" type="button">BRAKE</button> <button class="ctrl gas" id="gas" type="button">GAS ▲</button> </div> </div> <script> "use strict"; /* Canvas setup */ var canvas=document.getElementById("game"); var ctx=canvas.getContext("2d"); var W=innerWidth,H=innerHeight,DPR=1; function resize(){ W=innerWidth; H=innerHeight; DPR=Math.min(window.devicePixelRatio||1,2); canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR); canvas.style.width=W+"px"; canvas.style.height=H+"px"; ctx.setTransform(DPR,0,0,DPR,0,0); } window.addEventListener("resize",resize); resize(); /* Game state */ var running=false; var level=1,score=0,distance=0,speed=0; var playerX=0,roadMove=0,levelDistance=0; var traffic=[],spawnTimer=0,lastTime=0; var input={left:false,right:false,gas:false,brake:false}; var colours=["#e7463c","#3288d2","#e6bf32","#45a768","#e8e9ef"]; var maxLevel=16; function el(id){return document.getElementById(id)} function startGame(){ level=1; score=0; distance=0; speed=0; playerX=0; roadMove=0; levelDistance=0; spawnTimer=0; traffic=[]; for(var k in input)input[k]=false; running=true; el("title").textContent="BIKE TRAFFIC RUSH 3D"; el("overlay").classList.add("hide"); updateHUD(); } window.startGame=startGame; /* Touch controls */ function holdButton(id,key){ var button=el(id); function down(e){ e.preventDefault(); input[key]=true; try{button.setPointerCapture(e.pointerId)}catch(err){} } function up(e){ e.preventDefault(); input[key]=false; } button.addEventListener("pointerdown",down); button.addEventListener("pointerup",up); button.addEventListener("pointercancel",up); button.addEventListener("lostpointercapture",function(){ input[key]=false; }); } holdButton("left","left"); holdButton("right","right"); holdButton("gas","gas"); holdButton("brake","brake"); window.addEventListener("keydown",function(e){ var k=e.key.toLowerCase(); if(k==="arrowleft"||k==="a")input.left=true; if(k==="arrowright"||k==="d")input.right=true; if(k==="arrowup"||k==="w")input.gas=true; if(k==="arrowdown"||k==="s")input.brake=true; }); window.addEventListener("keyup",function(e){ var k=e.key.toLowerCase(); if(k==="arrowleft"||k==="a")input.left=false; if(k==="arrowright"||k==="d")input.right=false; if(k==="arrowup"||k==="w")input.gas=false; if(k==="arrowdown"||k==="s")input.brake=false; }); window.addEventListener("blur",function(){ for(var k in input)input[k]=false; }); /* Drawing helpers */ function polygon(points,color){ ctx.fillStyle=color; ctx.beginPath(); points.forEach(function(p,i){ if(i===0)ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); }); ctx.closePath(); ctx.fill(); } function rect(x,y,w,h,color){ ctx.fillStyle=color; ctx.fillRect(x,y,w,h); } function roundRect(x,y,w,h,r,color){ ctx.fillStyle=color; ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); } function road(y){ var t=Math.max(0,Math.min(1,(y-H*.30)/(H*.70))); return {t:t,half:W*(.075+.455*t)}; } function laneX(lane,t){ return W/2+lane*W*(.14+.31*t); } function tree(x,y,s){ rect(x-s*.1,y-s*.7,s*.2,s*.7,"#67452e"); ctx.fillStyle="#17522d"; ctx.beginPath();ctx.arc(x,y-s,s*.52,0,Math.PI*2);ctx.fill(); ctx.fillStyle="#2b7d3e"; ctx.beginPath();ctx.arc(x-s*.16,y-s*1.15,s*.33,0,Math.PI*2);ctx.fill(); } /* Road and scenery */ function drawWorld(){ var sky=ctx.createLinearGradient(0,0,0,H*.5); sky.addColorStop(0,"#48b9ec"); sky.addColorStop(1,"#e3f5ff"); rect(0,0,W,H, "#36784b"); ctx.fillStyle=sky; ctx.fillRect(0,0,W,H*.5); polygon([[0,H*.4],[W*.15,H*.26],[W*.32,H*.37], [W*.5,H*.24],[W*.7,H*.37],[W*.86,H*.27], [W,H*.36],[W,H*.5],[0,H*.5]],"#638a70"); var hz=H*.30; polygon([[W/2-W*.075,hz],[W/2+W*.075,hz], [W*1.06,H],[W*-.06,H]],"#393d44"); polygon([[W/2-W*.082,hz],[W/2-W*.075,hz], [W*-.06,H],[W*-.13,H]],"#e9e7da"); polygon([[W/2+W*.075,hz],[W/2+W*.082,hz], [W*1.13,H],[W*1.06,H]],"#e9e7da"); for(var i=0;i<22;i++){ var t=((i/22+roadMove*.0014)%1); var y=hz+t*(H-hz),r=road(y); var dash=4+t*35,w=1+t*3; ctx.fillStyle="#f6f4df"; ctx.fillRect(W/2-r.half/3-w/2,y,w,dash); ctx.fillRect(W/2+r.half/3-w/2,y,w,dash); } for(var j=0;j<9;j++){ var q=((j/9+roadMove*.0007)%1); var yy=hz+q*(H-hz),rr=road(yy),s=5+q*22; tree(W/2-rr.half-W*.04-s,yy,s); tree(W/2+rr.half+W*.04+s,yy,s*.8); } } /* Motorcycle drawing */ function drawBike(x,y,s,color){ ctx.fillStyle="#0007"; ctx.beginPath();ctx.ellipse(x,y,13*s,5*s,0,0,Math.PI*2);ctx.fill(); ctx.fillStyle="#111318"; ctx.beginPath();ctx.ellipse(x,y-8*s,5.5*s,15*s,0,0,Math.PI*2);ctx.fill(); ctx.strokeStyle="#a9b9c7";ctx.lineWidth=1.5*s;ctx.stroke(); ctx.strokeStyle=color;ctx.lineWidth=5*s; ctx.beginPath(); ctx.moveTo(x,y-9*s); ctx.lineTo(x-6*s,y-24*s); ctx.lineTo(x+6*s,y-24*s); ctx.lineTo(x,y-9*s); ctx.stroke(); ctx.strokeStyle="#161b20";ctx.lineWidth=2*s; ctx.beginPath();ctx.moveTo(x-10*s,y-28*s); ctx.lineTo(x+10*s,y-28*s);ctx.stroke(); ctx.fillStyle="#f0a02c"; ctx.fillRect(x-3*s,y-36*s,6*s,13*s); ctx.fillStyle="#f3f5f8"; ctx.beginPath();ctx.arc(x,y-41*s,6.5*s,0,Math.PI*2);ctx.fill(); ctx.fillStyle="#24374b"; ctx.fillRect(x-5*s,y-43*s,10*s,3*s); } /* Traffic */ function drawVehicle(v){ var y=H*.30+v.z*H*.70; var t=v.z,x=laneX(v.lane,t); var s=.30+t*1.25,w,h; if(v.type==="bike"){ drawBike(x,y,Math.max(.4,s*.65),v.color); return; } w=W*(v.type==="bus"?.12:.095)*s; h=H*(v.type==="bus"?.18:.145)*s; ctx.fillStyle="#0006"; ctx.beginPath();ctx.ellipse(x,y,w*.65,h*.12,0,0,Math.PI*2);ctx.fill(); roundRect(x-w*.5,y-h,w,h,Math.max(2,w*.07),v.color); roundRect(x-w*.37,y-h*.88,w*.74,h*.23,3,"#9bd4e7"); if(v.type==="bus"){ for(var i=0;i<4;i++){ roundRect(x-w*.42+i*w*.22,y-h*.58,w*.18,h*.17,2,"#bceaf4"); } }else{ roundRect(x-w*.35,y-h*.58,w*.7,h*.18,2,"#91c8df"); if(v.type==="truck"||v.type==="lorry"){ roundRect(x-w*.45,y-h*.34,w*.9,h*.29,2,"#d5dce2"); } } roundRect(x-w*.43,y-h*.13,w*.18,h*.06,2,"#ff4141"); roundRect(x+w*.25,y-h*.13,w*.18,h*.06,2,"#ff4141"); roundRect(x-w*.55,y-h*.28,w*.14,h*.23,2,"#151719"); roundRect(x+w*.41,y-h*.28,w*.14,h*.23,2,"#151719"); } function drawPlayer(){ drawBike(W/2+playerX*W*.30,H*.84, Math.min(1.15,W/390),"#e9273f"); } /* Game logic */ function update(dt){ if(!running)return; var maxSpeed=115+level*6; var acceleration=input.gas?125:0; var braking=input.brake?190:0; speed=Math.max(0,Math.min(maxSpeed, speed+(acceleration-braking-12)*dt)); if(input.left)playerX-=dt*1.7; if(input.right)playerX+=dt*1.7; playerX=Math.max(-1.05,Math.min(1.05,playerX)); distance+=speed*dt*.38; levelDistance+=speed*dt*.38; roadMove+=speed*dt; spawnTimer-=dt; if(spawnTimer<=0){ var lane=Math.floor(Math.random()*3)-1; var blocked=traffic.some(function(v){ return v.lane===lane&&v.z<.32; }); if(!blocked){ var r=Math.random(); var type=r<.24?"bus":r<.47?"truck":r<.70?"lorry":"bike"; traffic.push({ lane:lane,z:.01,type:type, color:colours[Math.floor(Math.random()*colours.length)], passed:false }); } spawnTimer=Math.max(.45,1.05-level*.025); } for(var i=traffic.length-1;i>=0;i--){ var v=traffic[i]; v.z+=(.20+speed/maxSpeed*.22+level*.005)*dt; if(v.z>.82&&!v.passed){ v.passed=true; var playerScreenX=W/2+playerX*W*.30; var otherX=laneX(v.lane,v.z); if(Math.abs(otherX-playerScreenX)<W*.075){ finishGame(false); return; } score+=50; } if(v.z>1.2)traffic.splice(i,1); } if(levelDistance>=400+level*100){ levelDistance=0; score+=500; if(level>=maxLevel){ finishGame(true); return; } level++; traffic=traffic.filter(function(v){return v.z<.25}); } updateHUD(); } function updateHUD(){ el("lv").textContent=level; el("dist").textContent=Math.floor(distance); el("pts").textContent=score; el("spd").textContent=Math.floor(speed); } function finishGame(won){ running=false; for(var k in input)input[k]=false; el("title").textContent=won?"🏆 YOU WIN!":"💥 GAME OVER"; el("message").textContent=won? "Congratulations! You completed all 16 levels. Score: "+score: "You crashed into traffic. Level: "+level+"/16. Score: "+score; el("start").textContent="PLAY AGAIN"; el("overlay").classList.remove("hide"); } /* Always keep the animation running */ function frame(now){ var dt=Math.min((now-lastTime)/1000||0,.04); lastTime=now; update(dt); drawWorld(); traffic.sort(function(a,b){return a.z-b.z}); traffic.forEach(drawVehicle); drawPlayer(); requestAnimationFrame(frame); } updateHUD(); requestAnimationFrame(frame); })(); </script> </body> </html>
